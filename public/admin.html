<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ‑панель — управление лидами</title>
    <link rel="icon" type="image/png" href="kukcha.png">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <div class="top-bar-left">
                <div class="lang-switch" aria-label="Language">
                    <span class="lang-label" data-i18n="languageLabel">Язык</span>
                    <div class="lang-toggle-group" role="group" aria-label="Language">
                        <button type="button" class="lang-toggle" data-lang="ru">RU</button>
                        <span class="lang-sep">|</span>
                        <button type="button" class="lang-toggle" data-lang="uz">UZ</button>
                    </div>
                </div>
                <div class="user-menu-wrapper" id="userMenuWrapper" style="display: none;">
                    <button type="button" class="user-menu-trigger" id="userMenuTrigger" title="Аккаунт" data-i18n-title="accountTitle">
                        <svg class="user-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                        <span class="user-role-label" id="userRoleLabel">—</span>
                    </button>
                    <div id="userDropdown" class="user-dropdown" style="display: none;">
                        <button type="button" class="user-dropdown-item logout" id="logoutDropdownBtn" data-i18n="logoutBtn">Выйти</button>
                    </div>
                </div>
            </div>
        </div>
        <!-- Login Section (shown when not authenticated) -->
        <div id="loginSection" class="login-wrapper">
            <div class="login-box">
                <h1 data-i18n="loginTitle">Вход в админ‑панель</h1>
                <p class="subtitle" data-i18n="loginSubtitle">Введите админ‑токен для доступа к панели</p>
                
                <div id="loginError" class="message error-message" style="display: none;">
                    <p id="loginErrorText"></p>
                </div>

                <form id="loginForm">
                    <div class="form-group">
                        <label for="adminToken" data-i18n="adminTokenLabel">Админ‑токен</label>
                        <input 
                            type="password" 
                            id="adminToken" 
                            name="adminToken" 
                            required 
                            placeholder="Введите админ‑токен"
                            data-i18n-placeholder="adminTokenPlaceholder"
                            autocomplete="off"
                        >
                    </div>
                    <button type="submit" class="submit-btn" data-i18n="loginButton">Войти</button>
                </form>
            </div>
        </div>

        <!-- Admin Panel Section (shown when authenticated) -->
        <div id="adminPanel" class="admin-panel fade-in" style="display: none;">
            <div class="admin-header">
                <h1 data-i18n="adminTitle">Админ‑панель — управление лидами</h1>
                <div class="header-actions">
                    <a class='btn-link' data-i18n='viewArchive' href='done_calls.html'>Архив →</a>
                    <button id="analyticsBtn" class="btn-link" style="display: none;" data-i18n="analyticsBtn">Аналитика</button>
                </div>
            </div>

            <div id="loadingMessage" class="message info-message" style="display: none;">
                <p data-i18n="loadingLeads">Загрузка лидов...</p>
            </div>

            <div id="errorMessage" class="message error-message" style="display: none;">
                <p id="errorText"></p>
            </div>

            <div id="noLeadsMessage" class="message info-message" style="display: none;">
                <p data-i18n="noLeads">Новых лидов нет.</p>
            </div>

            <div id="newClientNotification" class="message info-message slide-in-top" style="display: none;">
                <p id="newClientNotificationText">Появились новые клиенты. Обновите таблицу.</p>
            </div>

            <!-- Leads Table -->
            <div class="table-controls-wrapper" id="activeControlsWrapper" style="margin-bottom: 10px;">
                <button id="activeControlsToggle" class="controls-toggle" type="button" data-i18n="controlsToggle">Поиск и фильтры</button>
                <div class="header-actions table-controls">
                    <input id="activeSearchInput" type="text" class="table-search" placeholder="Поиск по имени или телефону" data-i18n-placeholder="searchPlaceholder">
                    <button id="refreshBtn" class="btn-link" type="button" data-i18n="refreshBtn">Обновить</button>
                    <button id="addClientBtn" class="add-client-btn" style="display: none;" data-i18n="addClientBtn">Добавить</button>
                </div>
            </div>
            <div id="leadsTableWrapper" style="display: none;">
                <div id="leadsCardGrid" class="lead-cards-grid">
                    <!-- Lead cards will be inserted here dynamically -->
                </div>
                <div id="activePagination" class="pagination" style="display: none;">
                    <button type="button" class="pagination-btn" id="activePaginationPrev" aria-label="Previous">← <span data-i18n="paginationPrev">Назад</span></button>
                    <span class="pagination-info" id="activePaginationInfo"></span>
                    <button type="button" class="pagination-btn" id="activePaginationNext" aria-label="Next"><span data-i18n="paginationNext">Вперёд</span> →</button>
                </div>
            </div>

            <!-- Analytics (Manager only) -->
            <div id="analyticsWrapper" style="display: none; margin-top: 20px;">
                <div class="analytics-header" style="margin-bottom: 16px;">
                    <a href="admin.html" class="btn-link" data-i18n="backToActive">← Назад к активным</a>
                </div>
                <table class="leads-table">
                    <thead>
                        <tr>
                            <th data-i18n="thPriority">Приоритет</th>
                            <th data-i18n="thCount">Количество</th>
                        </tr>
                    </thead>
                    <tbody id="analyticsTableBody">
                    </tbody>
                </table>
                <div class="analytics-chart-row" style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; margin-top: 20px;">
                    <div class="analytics-chart-wrap" style="flex: 0 0 auto;">
                        <canvas id="analyticsPieChart" width="280" height="280" aria-label="График приоритетов"></canvas>
                    </div>
                    <div class="analytics-legend" id="analyticsLegend" style=" flex: 1; min-width: 160px; font-size: 0.95em; line-height: 1.8;"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite" style="display: none;"></div>

    <!-- Modal for Add Client (Manager only) -->
    <div id="addClientModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2 data-i18n="addClientTitle">Добавить клиента</h2>
                <button class="modal-close" id="closeAddClientModal">&times;</button>
            </div>
            <div class="modal-body">
                <form id="addClientForm">
                    <div class="form-group">
                        <label for="addFullName" data-i18n="fullNameLabel">ФИО</label>
                        <input type="text" id="addFullName" name="fullName" required placeholder="Введите ФИО" data-i18n-placeholder="fullNamePlaceholder">
                    </div>
                    <div class="form-group">
                        <label for="addDoorType" data-i18n="doorTypeLabel">Тип двери</label>
                        <select id="addDoorType" name="doorType" required>
                            <option value="" data-i18n="doorTypePlaceholder">Выберите тип двери</option>
                            <option value="Standard Door" data-i18n="doorTypeStandard">Стандартная дверь</option>
                            <option value="Premium Door" data-i18n="doorTypePremium">Премиум дверь</option>
                            <option value="Custom Door" data-i18n="doorTypeCustom">Индивидуальная дверь</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="addMeasurements" data-i18n="measurementsLabel">Размеры</label>
                        <input type="text" id="addMeasurements" name="measurements" required placeholder="например 9x20" data-i18n-placeholder="measurementsPlaceholder">
                    </div>
                    <div class="form-group">
                        <label for="addPhoneNumber" data-i18n="phoneLabel">Телефон</label>
                        <input type="tel" id="addPhoneNumber" name="phoneNumber" required placeholder="Введите телефон" data-i18n-placeholder="phonePlaceholder">
                    </div>
                    <div class="form-group">
                        <label for="addSource"><span data-i18n="sourceLabel">Источник клиента</span> <span class="required">*</span></label>
                        <select id="addSource" name="source" required>
                            <option value="" data-i18n="sourceSelectPlaceholder">Выберите источник</option>
                            <option value="instagram" data-i18n="sourceInstagram">Instagram</option>
                            <option value="telegram" data-i18n="sourceTelegram">Telegram</option>
                            <option value="word_of_mouth" data-i18n="sourceWordOfMouth">Сарафан</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label data-i18n="prioritiesLabel">Приоритет клиента</label> <span class="required">*</span>
                        <div class="priority-buttons" id="addPriorityButtons" role="group" aria-label="Приоритет">
                            <button type="button" class="priority-btn" data-value="Качество и надёжность" data-i18n="priorityQualityReliability">Качество и надёжность</button>
                            <button type="button" class="priority-btn" data-value="Дизайн и стиль" data-i18n="priorityDesignStyle">Дизайн и стиль</button>
                        </div>
                        <p id="addPriorityError" class="field-error" style="display: none;" data-i18n="errorPriorityRequired"></p>
                    </div>
                    <div class="modal-actions">
                        <button type="button" class="btn-cancel" id="cancelAddClient" data-i18n="cancelBtn">Отмена</button>
                        <button type="submit" class="btn-submit" data-i18n="submitBtn">Сохранить</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal for DONE action -->
    <div id="doneModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2 data-i18n="doneTitle">Закрыть клиента</h2>
                <button class="modal-close" id="closeModal">&times;</button>
            </div>
            <div class="modal-body">
                <p data-i18n="doneSubtitle">Добавьте комментарий:</p>
                <form id="doneForm">
                    <input type="hidden" id="doneLeadId">
                    <div class="form-group">
                        <label for="comment" data-i18n="commentLabel">Комментарий</label>
                        <textarea 
                            id="comment" 
                            name="comment" 
                            rows="4" 
                            placeholder="Введите комментарий (необязательно)"
                            data-i18n-placeholder="commentPlaceholder"
                        ></textarea>
                    </div>
                    <div class="form-group">
                        <label for="doneLabel"><span data-i18n="labelLabel">Метка</span> <span class="required">*</span></label>
                        <select id="doneLabel" name="label" required>
                            <option value="" data-i18n="labelPlaceholder">Выберите метку</option>
                            <option value="Call Back" data-i18n="labelCallBack">Перезвонить</option>
                            <option value="Successful" data-i18n="labelSuccessful">Успешно</option>
                            <option value="Rejected" data-i18n="labelRejected">Отказ</option>
                        </select>
                    </div>
                    <div class="modal-actions">
                        <button type="button" class="btn-cancel" id="cancelDone" data-i18n="cancelBtn">Отмена</button>
                        <button type="submit" class="btn-submit" data-i18n="submitBtn">Сохранить</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

        function t(key) {
            const dict = translations[currentLang] || translations.ru;
            return dict[key] || '';
        }

        function applyTranslations() {
            document.documentElement.lang = currentLang;
            document.title = t('adminTitle');
            document.querySelectorAll('[data-i18n]').forEach((el) => {
                const key = el.getAttribute('data-i18n');
                el.textContent = t(key);
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach((el) => {
                const key = el.getAttribute('data-i18n-placeholder');
                el.setAttribute('placeholder', t(key));
            });
            document.querySelectorAll('[data-i18n-title]').forEach((el) => {
                const key = el.getAttribute('data-i18n-title');
                el.setAttribute('title', t(key));
            });
            const roleLabel = document.getElementById('userRoleLabel');
            if (roleLabel && userRole) {
                roleLabel.textContent = userRole === 'manager' ? t('roleManager') : t('roleCallManager');
            }
            updateNotificationText(lastNotificationCount);
        }

        function setLanguage(lang) {
            currentLang = lang === 'uz' ? 'uz' : 'ru';
            localStorage.setItem(LANG_KEY, currentLang);
            document.querySelectorAll('.lang-toggle').forEach((btn) => {
                btn.classList.toggle('active', btn.getAttribute('data-lang') === currentLang);
            });
            applyTranslations();
            if (adminToken) {
                applyActiveSearch();
            }
        }

        function initLanguage() {
            const stored = localStorage.getItem(LANG_KEY);
            setLanguage(stored || 'ru');
        }

        function getAuthHeader() {
            return adminToken ? { 'Authorization': 'Bearer ' + adminToken } : {};
        }

        function setRoleUI(role) {
            userRole = role;
            const label = document.getElementById('userRoleLabel');
            const addBtn = document.getElementById('addClientBtn');
            const analyticsBtn = document.getElementById('analyticsBtn');
            const userMenu = document.getElementById('userMenuWrapper');
            if (role === 'manager') {
                label.textContent = t('roleManager');
                addBtn.style.display = 'inline-block';
                analyticsBtn.style.display = 'inline-block';
            } else {
                label.textContent = t('roleCallManager');
                addBtn.style.display = 'none';
                analyticsBtn.style.display = 'none';
            }
            if (userMenu) {
                userMenu.style.display = 'flex';
            }
        }

        // ============================================
        // LOGIN FUNCTIONALITY
        // ============================================

        document.querySelectorAll('.lang-toggle').forEach((btn) => {
            btn.addEventListener('click', () => {
                setLanguage(btn.getAttribute('data-lang'));
            });
        });
        initLanguage();

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const token = document.getElementById('adminToken').value.trim();
            document.getElementById('loginError').style.display = 'none';

            if (!token) {
                showLoginError(t('errorTokenRequired'));
                return;
            }

            try {
                const response = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token })
                });

                const data = await response.json();

                if (response.ok) {
                    adminToken = data.token;
                    userRole = (data.role != null && data.role !== '') ? String(data.role).toLowerCase() : null;
                    sessionStorage.setItem('authToken', data.token);
                    sessionStorage.setItem('authRole', userRole || '');
                    setRoleUI(userRole);
                    document.getElementById('loginSection').style.display = 'none';
                    document.getElementById('adminPanel').style.display = 'block';
                    document.getElementById('adminToken').value = '';
                    applyTranslations();
                    initLastSeenAt();
                    startPolling();
                    startSilentRefresh();
                    loadLeads();
                } else {
                    showLoginError(t('errorInvalidToken'));
                }

        const LAST_SEEN_KEY = 'crm_lastSeenAt';

        function initLastSeenAt() {
            if (!localStorage.getItem(LAST_SEEN_KEY)) {
                localStorage.setItem(LAST_SEEN_KEY, new Date().toISOString());
            }
        }

        function getLastSeenAt() {
            return localStorage.getItem(LAST_SEEN_KEY);
        }

        function updateLastSeenAtFromLeads(leads) {
            if (!leads || leads.length === 0) {
                return;
            }
            let maxCreated = null;
            leads.forEach(lead => {
                if (lead.createdAt) {
                    const d = new Date(lead.createdAt);
                    if (!isNaN(d.getTime())) {
                        if (!maxCreated || d > maxCreated) {
                            maxCreated = d;
                        }
                    }
                }
            });
            if (maxCreated) {
                const current = getLastSeenAt();
                if (!current || new Date(current) < maxCreated) {
                    localStorage.setItem(LAST_SEEN_KEY, maxCreated.toISOString());
                }
            }
        }

        async function loadLeads() {
            if (!adminToken) return;

            document.getElementById('loadingMessage').style.display = 'block';
            document.getElementById('errorMessage').style.display = 'none';
            document.getElementById('noLeadsMessage').style.display = 'none';
            document.getElementById('leadsTableWrapper').style.display = 'none';

            try {
                const response = await fetch('/api/admin/leads', {
                    method: 'GET',
                    headers: getAuthHeader()
                });

                const data = await response.json();

                document.getElementById('loadingMessage').style.display = 'none';

                if (response.ok) {
                    allActiveLeads = data.leads || [];
                    activeCurrentPage = 1;
                    if (allActiveLeads.length > 0) {
                        updateLastSeenAtFromLeads(allActiveLeads);
                        applyActiveSearch();
                        document.getElementById('newClientNotification').style.display = 'none';
                    } else {
                        document.getElementById('noLeadsMessage').style.display = 'block';
                    }
                } else {
                    if (response.status === 401) {
                        showError(t('errorSessionExpired'));
                        sessionStorage.removeItem('authToken');
                        sessionStorage.removeItem('authRole');
                        setTimeout(() => {
                            adminToken = null;
                            document.getElementById('loginSection').style.display = 'block';
                            document.getElementById('adminPanel').style.display = 'none';
                            const userMenu = document.getElementById('userMenuWrapper');
                            if (userMenu) {
                                userMenu.style.display = 'none';
                            }

                        showError(t('errorLoadLeads'));
                    }
                }
            } catch (error) {
                console.error('Error loading leads:', error);
                document.getElementById('loadingMessage').style.display = 'none';
                showError(t('errorNetwork'));
            }
        }

        async function pollForNewClients() {
            if (!adminToken) return;
            const since = getLastSeenAt();
            if (!since) {
                initLastSeenAt();
                return;
            }
            try {
                const response = await fetch('/api/admin/leads/poll?since=' + encodeURIComponent(since), {
                    method: 'GET',
                    headers: getAuthHeader()
                });
                const data = await response.json();
                if (response.ok) {
                    if (data.newClients && data.newClients > 0) {
                        lastNotificationCount = data.newClients;
                        updateNotificationText(lastNotificationCount);
                        document.getElementById('newClientNotification').style.display = 'block';
                    }
                } else if (response.status === 401) {
                    showError(t('errorSessionExpired'));
                }
            } catch (err) {
                // Fail silently to keep polling lightweight
                console.error('Polling error', err);
            }
        }

        async function loadPriorityAnalytics() {
            if (!adminToken) return;
            document.getElementById('errorMessage').style.display = 'none';
            const tbody = document.getElementById('analyticsTableBody');
            tbody.innerHTML = '';
            const legendEl = document.getElementById('analyticsLegend');
            if (legendEl) legendEl.innerHTML = '';
            try {
                const response = await fetch('/api/admin/analytics/priorities', {
                    method: 'GET',
                    headers: getAuthHeader()
                });
                const data = await response.json();
                if (response.ok) {
                    const priorityOrder = ['Качество и надёжность', 'Дизайн и стиль'];
                    const counts = {};
                    let total = 0;
                    priorityOrder.forEach(label => {
                        const count = data.priorities && data.priorities[label] ? data.priorities[label] : 0;
                        counts[label] = count;
                        total += count;
                    });
                    priorityOrder.forEach(label => {
                        const row = document.createElement('tr');
                        const count = counts[label];
                        const displayLabel = getPriorityDisplay(label);
                        row.innerHTML = `
                            <td>${escapeHtml(displayLabel)}</td>
                            <td>${count}</td>
                        `;
                        tbody.appendChild(row);
                    });
                    if (legendEl) {
                        legendEl.innerHTML = priorityOrder.map(label =>
                            `${escapeHtml(getPriorityDisplay(label))}: ${counts[label]}`
                        ).join('<br>');
                    }
                    const canvas = document.getElementById('analyticsPieChart');
                    if (canvas && typeof Chart !== 'undefined') {
                        if (analyticsPieChartInstance) {
                            analyticsPieChartInstance.destroy();
                            analyticsPieChartInstance = null;
                        }
                        const labels = priorityOrder.map(l => getPriorityDisplay(l));
                        const values = priorityOrder.map(l => counts[l]);
                        analyticsPieChartInstance = new Chart(canvas.getContext('2d'), {
                            type: 'pie',
                            data: {
                                labels: labels,
                                datasets: [{
                                    data: values,
                                    backgroundColor: ['#667eea', '#764ba2'],
                                    borderWidth: 1
                                }]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: true,
                                plugins: {
                                    legend: { display: false },
                                    tooltip: {
                                        callbacks: {
                                            label: function(ctx) {
                                                const v = ctx.raw;
                                                const pct = total ? ((v / total) * 100).toFixed(1) : 0;
                                                return ctx.label + ': ' + pct + '%';
                                            }
                                        }
                                    }
                                }
                            }
                        });
                    }
                } else if (response.status === 403) {
                    showError(t('errorForbiddenManager'));
                } else if (response.status === 401) {
                    sessionStorage.removeItem('authToken');
                    sessionStorage.removeItem('authRole');
                    showError(t('errorSessionExpired'));
                } else {
                    showError(t('errorLoadLeads'));
                }
            } catch (error) {
                console.error('Error loading analytics:', error);
                showError(t('errorNetwork'));
            }
        }

        function createLeadCardElement(lead, index) {
            const card = document.createElement('div');
            const label = lead.label || 'New Client';
            const isNew = label === 'New Client';
            card.className = `lead-card card-animate${isNew ? ' lead-card--new' : ''}`;
            card.setAttribute('data-lead-id', lead._id);
            card.style.animationDelay = `${index * 0.05}s`;
            card.innerHTML = buildLeadCardHTML(lead, index);
            return card;
        }

        function displayLeads(leads) {
            const grid = document.getElementById('leadsCardGrid');
            grid.innerHTML = '';
            leads.forEach((lead, index) => {
                const card = createLeadCardElement(lead, index);
                grid.appendChild(card);
            });
            document.getElementById('leadsTableWrapper').style.display = 'block';
        }

        function syncLeadsDOM(pageLeads) {
            const grid = document.getElementById('leadsCardGrid');
            if (!grid) return;
            const wantedIds = new Set(pageLeads.map(l => l._id));
            for (const card of [...grid.children]) {
                const id = card.getAttribute('data-lead-id');
                if (id && !wantedIds.has(id)) card.remove();
            }
            for (let i = 0; i < pageLeads.length; i++) {
                const lead = pageLeads[i];
                const existing = grid.querySelector(`[data-lead-id="${lead._id}"]`);
                if (existing) {
                    existing.innerHTML = buildLeadCardHTML(lead, i);
                    if (existing !== grid.children[i]) grid.insertBefore(existing, grid.children[i] || null);
                } else {
                    const card = createLeadCardElement(lead, i);
                    grid.insertBefore(card, grid.children[i] || null);
                }
            }
        }

        const SILENT_REFRESH_INTERVAL_MS = 30000;
        let silentRefreshIntervalId = null;

        async function silentRefreshLeads() {
            if (!adminToken) return;
            const analyticsVisible = document.getElementById('analyticsWrapper').style.display !== 'none';
            try {
                const response = await fetch('/api/admin/leads', { method: 'GET', headers: getAuthHeader() });
                const data = await response.json();
                if (!response.ok) return;
                allActiveLeads = data.leads || [];
                if (analyticsVisible) return;
                const filtered = getFilteredActiveLeads();
                const totalPages = Math.max(1, Math.ceil(filtered.length / ACTIVE_PAGE_SIZE));
                if (activeCurrentPage > totalPages) activeCurrentPage = totalPages;
                const start = (activeCurrentPage - 1) * ACTIVE_PAGE_SIZE;
                const pageLeads = filtered.slice(start, start + ACTIVE_PAGE_SIZE);
                syncLeadsDOM(pageLeads);
                const paginationEl = document.getElementById('activePagination');
                const infoEl = document.getElementById('activePaginationInfo');
                const prevBtn = document.getElementById('activePaginationPrev');
                const nextBtn = document.getElementById('activePaginationNext');
                if (totalPages > 1 && paginationEl && infoEl) {
                    paginationEl.style.display = 'flex';
                    infoEl.textContent = (t('paginationPage') || 'Стр. {{current}} из {{total}}').replace('{{current}}', String(activeCurrentPage)).replace('{{total}}', String(totalPages));
                    if (prevBtn) prevBtn.disabled = activeCurrentPage <= 1;
                    if (nextBtn) nextBtn.disabled = activeCurrentPage >= totalPages;
                } else if (paginationEl) paginationEl.style.display = 'none';
                document.getElementById('noLeadsMessage').style.display = filtered.length === 0 ? 'block' : 'none';
                if (filtered.length === 0) document.getElementById('leadsTableWrapper').style.display = 'none';
            } catch (e) { /* silent */ }
        }

        function startSilentRefresh() {

        function getFilteredActiveLeads() {

                const fullName = (lead.fullName || (lead.name + ' ' + lead.surname).trim() || '').toLowerCase();
                const phone = (lead.phoneNumber || '').toLowerCase();
                return fullName.includes(query) || phone.includes(query);
            });

        function applyActiveSearch() {
            const filtered = getFilteredActiveLeads();
            const totalPages = Math.max(1, Math.ceil(filtered.length / ACTIVE_PAGE_SIZE));
            if (activeCurrentPage > totalPages) activeCurrentPage = totalPages;
            const start = (activeCurrentPage - 1) * ACTIVE_PAGE_SIZE;
            const pageLeads = filtered.slice(start, start + ACTIVE_PAGE_SIZE);

            document.getElementById('noLeadsMessage').style.display = filtered.length === 0 ? 'block' : 'none';
            if (filtered.length > 0) {
                displayLeads(pageLeads);

                const infoEl = document.getElementById('activePaginationInfo');
                const prevBtn = document.getElementById('activePaginationPrev');

                } else {
                    paginationEl.style.display = 'none';
                }
            } else {
                document.getElementById('leadsTableWrapper').style.display = 'none';
            }
        }

                let word = 'новых клиентов';
                if (mod10 === 1 && mod100 !== 11) {
                    word = 'новый клиент';
                } else if (mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)) {
                    word = 'новых клиента';
                }
                return `${count} ${word}. ${t('refreshNotice')}`;

            return `${count} ta yangi mijoz. ${t('refreshNotice')}`;

        function showToast(label) {
            const el = document.getElementById('toast');
            if (!el) return;
            if (toastTimeoutId) {
                clearTimeout(toastTimeoutId);
                toastTimeoutId = null;
            }
            let text = '';
            let type = '';
            switch (label) {
                case 'Successful':
                    text = 'Успешно закрыт';
                    type = 'toast--success';
                    break;
                case 'Call Back':
                    text = 'Добавлен в перезвон';
                    type = 'toast--call-back';
                    break;
                case 'Rejected':
                    text = 'Клиент отказался';
                    type = 'toast--rejected';
                    break;
                default:
                    text = 'Сохранено';
                    type = 'toast--success';
            }
            el.className = 'toast ' + type;
            el.textContent = text;
            el.style.display = 'block';
            toastTimeoutId = setTimeout(() => {
                el.style.display = 'none';
                toastTimeoutId = null;
            }, 3000);
        }

        // ============================================
        // DONE ACTION
        // ============================================

        function handleDone(leadId) {
            document.getElementById('doneLeadId').value = leadId;
            document.getElementById('comment').value = '';
            document.getElementById('doneLabel').value = '';
            const modal = document.getElementById('doneModal');
            modal.style.display = 'flex';
            // Trigger animation
            setTimeout(() => {
                modal.classList.add('modal-open');
            }, 10);
        }

        document.getElementById('doneForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const leadId = document.getElementById('doneLeadId').value;
            const comment = document.getElementById('comment').value.trim();
            const label = document.getElementById('doneLabel').value;

            if (!label) {
                alert(t('validationSelectLabel'));
                return;
            }

            try {
                const response = await fetch(`/api/admin/leads/${leadId}/done`, {
                    method: 'POST',
                    headers: Object.assign({ 'Content-Type': 'application/json' }, getAuthHeader()),
                    body: JSON.stringify({ comment, label })
                });

                const data = await response.json();

                if (response.ok) {
                    closeModal();
                    showToast(data.lead && data.lead.label ? data.lead.label : label);
                    loadLeads();
                } else {
                    if (response.status === 401) {
                        sessionStorage.removeItem('authToken');
                        sessionStorage.removeItem('authRole');
                        showError(t('errorSessionExpired'));
                        setTimeout(() => {
                            adminToken = null;
                            document.getElementById('loginSection').style.display = 'block';
                            document.getElementById('adminPanel').style.display = 'none';
                            document.getElementById('doneModal').style.display = 'none';
                            const userMenu = document.getElementById('userMenuWrapper');
                            if (userMenu) {
                                userMenu.style.display = 'none';
                            }
                        }, 2000);
                    } else {
                        alert(t('errorLoadLeads'));
                    }
                }
            } catch (error) {
                console.error('Error updating lead:', error);
                alert(t('errorNetwork'));
            }
        });

        // Close modal handlers
        function closeModal() {
            const modal = document.getElementById('doneModal');
            modal.classList.remove('modal-open');
            setTimeout(() => {
                modal.style.display = 'none';
            }, 300); // Match CSS animation duration
        }

        document.getElementById('closeModal').addEventListener('click', closeModal);
        document.getElementById('cancelDone').addEventListener('click', closeModal);

        // Close modal when clicking outside
        document.getElementById('doneModal').addEventListener('click', (e) => {
            if (e.target.id === 'doneModal') {
                closeModal();
            }
        });

        // ============================================
        // NOT ACTION (Archive)
        // ============================================

        async function handleNot(leadId) {
            if (!confirm(t('confirmArchive'))) {
                return;
            }

            try {
                const response = await fetch(`/api/admin/leads/${leadId}/not`, {
                    method: 'POST',
                    headers: getAuthHeader()
                });

                const data = await response.json();

                if (response.ok) {
                    // Reload leads
                    loadLeads();
                } else {
                    if (response.status === 401) {
                        sessionStorage.removeItem('authToken');
                        sessionStorage.removeItem('authRole');
                        showError(t('errorSessionExpired'));
                        setTimeout(() => {
                            adminToken = null;
                            document.getElementById('loginSection').style.display = 'block';
                            document.getElementById('adminPanel').style.display = 'none';
                            const userMenu = document.getElementById('userMenuWrapper');
                            if (userMenu) {
                                userMenu.style.display = 'none';
                            }
                        }, 2000);
                    } else {
                        alert(t('errorLoadLeads'));
                    }
                }
            } catch (error) {
                console.error('Error archiving lead:', error);
                alert(t('errorNetwork'));
            }
        }

        tryRestoreSession();
    </script>
</body>
</html>
