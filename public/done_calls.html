    <style>
    /* =====================================================================
       Единая стилистика «один акцент» для карточек архива (как на доске).
       Scoped под #archivePanel/#archiveCardGrid — переопределяет общий
       styles.css ТОЛЬКО на этой странице. admin.html не затрагивается.
       Карточки нейтральные (графит); цвет = смысл живёт на ИСХОДЕ сделки
       (метка) и тонкой полоске слева. Источники нейтрализованы.
       ===================================================================== */
    #archivePanel {
        --accent:      #5e6ad2;   /* единый индиго-акцент */
        --accent-text: #aab2ff;
        --o-success:   #22c55e;   /* успешно — зелёный */
        --o-callback:  #eab308;   /* перезвонить — жёлтый */
        --o-rejected:  #e0607a;   /* отказ — красный (приглушённый) */
        --o-new:       #868c9e;   /* новый — нейтральный графит */
    }

    /* ---- сетка ---- */
    #archiveCardGrid.lead-cards-grid { gap:14px; }

    /* ---- нейтральная графитовая карточка ---- */
    #archiveCardGrid .lead-card {
        position:relative;
        background:rgba(255,255,255,.035);
        backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
        border:1px solid rgba(255,255,255,.08);
        border-radius:12px;
        box-shadow:none;
        padding:14px 14px 12px 16px;
        gap:10px;
        overflow:hidden;
    }
    #archiveCardGrid .lead-card:hover {
        transform:translateY(-2px);
        border-color:rgba(255,255,255,.12);
        box-shadow:0 8px 22px rgba(0,0,0,.35);
    }
    /* единственное место, где цвет = смысл: полоска исхода слева */
    #archiveCardGrid .lead-card::before {
        content:""; position:absolute; left:0; top:0; bottom:0; width:3px;
        background:var(--oc, var(--o-new));
    }
    #archiveCardGrid .lead-card.out-successful { --oc:var(--o-success); }
    #archiveCardGrid .lead-card.out-call-back  { --oc:var(--o-callback); }
    #archiveCardGrid .lead-card.out-rejected   { --oc:var(--o-rejected); }
    #archiveCardGrid .lead-card.out-new        { --oc:var(--o-new); }

    /* ---- типографика ---- */
    #archiveCardGrid .lead-card-name  { font-weight:700; font-size:1.05em; letter-spacing:-.01em; color:#e7e8ec; }
    #archiveCardGrid .lead-card-phone { color:rgba(231,232,236,.62); font-weight:500; }
    #archiveCardGrid .field-label     { color:rgba(231,232,236,.4); font-weight:600; letter-spacing:.04em; }
    #archiveCardGrid .field-value     { color:rgba(231,232,236,.9); }
    #archiveCardGrid .lead-card-comment {
        background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08); border-radius:9px;
    }
    #archiveCardGrid .comment-text { color:rgba(231,232,236,.85); }

    /* ---- бейджи: метка-исход несёт смысл-цвет (мягко), источник нейтрален ---- */
    #archiveCardGrid .badge {
        border-radius:7px; font-weight:600; padding:4px 9px; border:1px solid transparent;
    }
    #archiveCardGrid .badge-new {
        background:rgba(134,140,158,.18); color:#c7cbd6; border-color:rgba(134,140,158,.32);
    }
    #archiveCardGrid .badge-call-back {
        background:color-mix(in srgb, var(--o-callback) 16%, transparent); color:#f5d77a;
        border-color:color-mix(in srgb, var(--o-callback) 32%, transparent);
    }
    #archiveCardGrid .badge-successful {
        background:color-mix(in srgb, var(--o-success) 16%, transparent); color:#86efac;
        border-color:color-mix(in srgb, var(--o-success) 32%, transparent);
    }
    #archiveCardGrid .badge-rejected {
        background:color-mix(in srgb, var(--o-rejected) 16%, transparent); color:#f3b6c2;
        border-color:color-mix(in srgb, var(--o-rejected) 32%, transparent);
    }
    /* источники — единый нейтральный графит вместо радуги градиентов */
    #archiveCardGrid .badge-source {
        background:rgba(255,255,255,.06); color:rgba(231,232,236,.6);
        border:1px solid rgba(255,255,255,.1); box-shadow:none; font-weight:600;
    }

    /* ---- действия: «Редактировать» = единый акцент, «Журнал» = ghost ---- */
    #archiveCardGrid .lead-card-actions { border-top:1px solid rgba(255,255,255,.08); gap:7px; }
    #archiveCardGrid .btn-edit {
        background:var(--accent); color:#fff; border:none; border-radius:8px;
        padding:8px 14px; font-weight:600; font-size:.8rem;
    }
    #archiveCardGrid .btn-edit:hover { background:var(--accent); filter:brightness(1.1); box-shadow:none; transform:translateY(-1px); }
    #archiveCardGrid .btn-journal {
        background:rgba(255,255,255,.06); color:rgba(231,232,236,.82);
        border:1px solid rgba(255,255,255,.12); border-radius:8px;
        padding:8px 14px; font-weight:600; font-size:.8rem; cursor:pointer;
        transition:background .15s ease, transform .12s ease, color .15s ease;
    }
    #archiveCardGrid .btn-journal:hover { background:rgba(255,255,255,.1); color:#fff; transform:translateY(-1px); }

    /* ---- мобильно: карточки идут в один столбец (не сужаются), крупнее тапы ---- */
    @media (max-width:600px){
        #archiveCardGrid.lead-cards-grid { grid-template-columns:1fr; gap:12px; }
        #archiveCardGrid .btn-edit,
        #archiveCardGrid .btn-journal { padding:10px 14px; }
    }
    </style>

        function t(key) {
            const dict = translations[currentLang] || translations.ru;
            return dict[key] || '';
        }

        function applyTranslations() {
            document.documentElement.lang = currentLang;
            document.title = t('pageTitle');
            document.querySelectorAll('[data-i18n]').forEach((el) => {
                const key = el.getAttribute('data-i18n');
                el.textContent = t(key);
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach((el) => {
                const key = el.getAttribute('data-i18n-placeholder');
                el.setAttribute('placeholder', t(key));
            });
            document.querySelectorAll('[data-i18n-title]').forEach((el) => {
                const key = el.getAttribute('data-i18n-title');
                el.setAttribute('title', t(key));
            });
            const roleLabel = document.getElementById('userRoleLabel');
            if (roleLabel && userRole) {
                roleLabel.textContent = userRole === 'manager' ? t('roleManager') : t('roleCallManager');
            }
        }

        function setLanguage(lang) {
            currentLang = lang === 'uz' ? 'uz' : 'ru';
            localStorage.setItem(LANG_KEY, currentLang);
            document.querySelectorAll('.lang-toggle').forEach((btn) => {
                btn.classList.toggle('active', btn.getAttribute('data-lang') === currentLang);
            });
            applyTranslations();
            if (adminToken) {
                applyArchiveFilters();
            }
        }

        function initLanguage() {
            const stored = localStorage.getItem(LANG_KEY);
            setLanguage(stored || 'ru');
        }

        function getApiBase() {
            return '';
        }

        function getAuthHeader() {
            return adminToken ? { 'Authorization': 'Bearer ' + adminToken } : {};
        }

        function setRoleUI(role) {
            userRole = role;
            const label = document.getElementById('userRoleLabel');
            const userMenu = document.getElementById('userMenuWrapper');
            label.textContent = role === 'manager' ? t('roleManager') : t('roleCallManager');
            if (userMenu) {
                userMenu.style.display = 'flex';
            }
        }

        // ============================================
        // LOGIN FUNCTIONALITY
        // ============================================

        document.querySelectorAll('.lang-toggle').forEach((btn) => {
            btn.addEventListener('click', () => {
                setLanguage(btn.getAttribute('data-lang'));
            });
        });
        initLanguage();

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const token = document.getElementById('adminToken').value.trim();
            document.getElementById('loginError').style.display = 'none';

            if (!token) {
                showLoginError(t('errorTokenRequired'));
                return;

        async function loadDoneCalls() {
            if (!adminToken) return;

            document.getElementById('loadingMessage').style.display = 'block';
            document.getElementById('errorMessage').style.display = 'none';
            document.getElementById('noLeadsMessage').style.display = 'none';
            document.getElementById('leadsTableWrapper').style.display = 'none';

            try {
                let url = getApiBase() + '/api/admin/done-calls';
                if (dateFilterEnabled && (dateFilterFrom || dateFilterTo)) {
                    const params = new URLSearchParams();
                    if (dateFilterFrom) params.set('dateFrom', dateFilterFrom);
                    if (dateFilterTo) params.set('dateTo', dateFilterTo);
                    url += '?' + params.toString();
                }
                const response = await fetch(url, {
                    method: 'GET',
                    headers: getAuthHeader()
                });

                const data = await response.json();

                document.getElementById('loadingMessage').style.display = 'none';

                if (response.ok) {
                    allArchiveLeads = data.leads || [];
                    archiveCurrentPage = 1;
                    if (allArchiveLeads.length > 0) {
                        applyArchiveFilters();
                    } else {
                        document.getElementById('noLeadsMessage').style.display = 'block';
                        document.getElementById('leadsTableWrapper').style.display = 'none';
                    }
                } else {
                    if (response.status === 401) {
                        showError(t('errorSessionExpired'));
                        sessionStorage.removeItem('authToken');
                        sessionStorage.removeItem('authRole');
                        setTimeout(() => {
                            adminToken = null;
                            document.getElementById('loginSection').style.display = 'block';
                            document.getElementById('archivePanel').style.display = 'none';
                            const userMenu = document.getElementById('userMenuWrapper');
                            if (userMenu) {
                                userMenu.style.display = 'none';
                            }
                        }, 2000);
                    } else {
                        showError(t('errorLoadArchive'));
                    }
                }
            } catch (error) {
                console.error('Error loading archive:', error);
                document.getElementById('loadingMessage').style.display = 'none';
                showError(t('errorNetwork'));
            }
        }

        function displayDoneCalls(leads) {
            const grid = document.getElementById('archiveCardGrid');
            grid.innerHTML = '';

            leads.forEach((lead, index) => {
                archivedLeadsById[lead._id] = lead;

        function syncArchiveDOM(pageLeads) {
            const grid = document.getElementById('archiveCardGrid');
            if (!grid) return;
            pageLeads.forEach(l => { archivedLeadsById[l._id] = l; });
            const wantedIds = new Set(pageLeads.map(l => l._id));
            for (const card of [...grid.children]) {
                const id = card.getAttribute('data-lead-id');
                if (id && !wantedIds.has(id)) card.remove();
            }
            for (let i = 0; i < pageLeads.length; i++) {
                const lead = pageLeads[i];
                const existing = grid.querySelector(`[data-lead-id="${lead._id}"]`);
                if (existing) {
                    existing.className = 'lead-card card-animate ' + archiveOutcomeClass(lead);
                    existing.innerHTML = buildArchiveCardHTML(lead, i);
                    if (existing !== grid.children[i]) grid.insertBefore(existing, grid.children[i] || null);
                } else {
                    const card = createArchiveCardElement(lead, i);
                    grid.insertBefore(card, grid.children[i] || null);
                }
            }
        }

        const ARCHIVE_SILENT_REFRESH_INTERVAL_MS = 30000;

        async function silentRefreshArchive() {
            if (!adminToken) return;
            let url = getApiBase() + '/api/admin/done-calls';
            if (dateFilterEnabled && (dateFilterFrom || dateFilterTo)) {
                const params = new URLSearchParams();
                if (dateFilterFrom) params.set('dateFrom', dateFilterFrom);
                if (dateFilterTo) params.set('dateTo', dateFilterTo);
                url += '?' + params.toString();
            }
            try {
                const response = await fetch(url, { method: 'GET', headers: getAuthHeader() });
                const data = await response.json();
                if (!response.ok) return;
                allArchiveLeads = data.leads || [];
                const filtered = getFilteredArchiveLeads();
                const totalPages = Math.max(1, Math.ceil(filtered.length / ARCHIVE_PAGE_SIZE));
                if (archiveCurrentPage > totalPages) archiveCurrentPage = totalPages;
                const start = (archiveCurrentPage - 1) * ARCHIVE_PAGE_SIZE;
                const pageLeads = filtered.slice(start, start + ARCHIVE_PAGE_SIZE);
                syncArchiveDOM(pageLeads);
                const paginationEl = document.getElementById('archivePagination');
                const infoEl = document.getElementById('archivePaginationInfo');
                const prevBtn = document.getElementById('archivePaginationPrev');
                const nextBtn = document.getElementById('archivePaginationNext');
                if (totalPages > 1 && paginationEl && infoEl) {
                    paginationEl.style.display = 'flex';
                    infoEl.textContent = (t('paginationPage') || 'Стр. {{current}} из {{total}}').replace('{{current}}', String(archiveCurrentPage)).replace('{{total}}', String(totalPages));
                    if (prevBtn) prevBtn.disabled = archiveCurrentPage <= 1;
                    if (nextBtn) nextBtn.disabled = archiveCurrentPage >= totalPages;
                } else if (paginationEl) paginationEl.style.display = 'none';
                document.getElementById('noLeadsMessage').style.display = filtered.length === 0 ? 'block' : 'none';
                if (filtered.length === 0) document.getElementById('leadsTableWrapper').style.display = 'none';
            } catch (e) { /* silent */ }
        }

        function startArchiveSilentRefresh() {
            if (archiveSilentRefreshIntervalId) clearInterval(archiveSilentRefreshIntervalId);
            archiveSilentRefreshIntervalId = setInterval(silentRefreshArchive, ARCHIVE_SILENT_REFRESH_INTERVAL_MS);
        }

        function stopArchiveSilentRefresh() {

                archiveSilentRefreshIntervalId = null;
            }

        // ===== Realtime: archive updates live when leads close/change =====
        // WebSocket is the instant trigger; the 30s poll above stays as a safety net.
        let rtSocket = null, rtRefreshTimer = null, rtRefreshPending = false;
        function scheduleArchiveRefresh() {
            rtRefreshPending = true;
            if (rtRefreshTimer) return;
            rtRefreshTimer = setTimeout(function () {
                rtRefreshTimer = null;
                if (!rtRefreshPending) return;
                rtRefreshPending = false;
                silentRefreshArchive();
            }, 300);
        }
        function startRealtime() {
            if (!adminToken || typeof io === 'undefined') return; // no token / client unavailable → poll fallback
            if (rtSocket) { rtSocket.auth = { token: adminToken }; if (!rtSocket.connected) rtSocket.connect(); return; }
            rtSocket = io({ auth: { token: adminToken }, transports: ['websocket', 'polling'] });
            rtSocket.on('connect', () => { scheduleArchiveRefresh(); }); // reconcile on (re)connect
            rtSocket.on('lead:changed', () => { scheduleArchiveRefresh(); });
            rtSocket.on('connect_error', () => { /* fallback: 30s safety poll keeps archive fresh */ });
        }
        function stopRealtime() {
            if (rtSocket) { rtSocket.removeAllListeners(); rtSocket.disconnect(); rtSocket = null; }
            if (rtRefreshTimer) { clearTimeout(rtRefreshTimer); rtRefreshTimer = null; }
            rtRefreshPending = false;
        }

        function getFilteredArchiveLeads() {
            const searchInput = document.getElementById('archiveSearchInput');
            const labelSelect = document.getElementById('archiveLabelFilter');
            const query = searchInput ? searchInput.value.trim().toLowerCase() : '';
            const label = labelSelect ? labelSelect.value : '';
            let filtered = allArchiveLeads;
            if (label) filtered = filtered.filter(lead => (lead.label || '') === label);
            if (query) {
                filtered = filtered.filter(lead => {
                    const fullName = (lead.fullName || (lead.name + ' ' + lead.surname).trim() || '').toLowerCase();
                    const phone = (lead.phoneNumber || '').toLowerCase();
                    return fullName.includes(query) || phone.includes(query);
                });
            }
            return filtered;
        }

        function applyArchiveFilters() {
            const filtered = getFilteredArchiveLeads();
            const totalPages = Math.max(1, Math.ceil(filtered.length / ARCHIVE_PAGE_SIZE));
            if (archiveCurrentPage > totalPages) archiveCurrentPage = totalPages;
            const start = (archiveCurrentPage - 1) * ARCHIVE_PAGE_SIZE;
            const pageLeads = filtered.slice(start, start + ARCHIVE_PAGE_SIZE);

            document.getElementById('noLeadsMessage').style.display = filtered.length === 0 ? 'block' : 'none';
            if (filtered.length > 0) {
                displayDoneCalls(pageLeads);
                const paginationEl = document.getElementById('archivePagination');
                const infoEl = document.getElementById('archivePaginationInfo');
                const prevBtn = document.getElementById('archivePaginationPrev');
                const nextBtn = document.getElementById('archivePaginationNext');
                if (totalPages > 1) {
                    paginationEl.style.display = 'flex';
                    infoEl.textContent = (t('paginationPage') || 'Стр. {{current}} из {{total}}')
                        .replace('{{current}}', String(archiveCurrentPage))
                        .replace('{{total}}', String(totalPages));
                    prevBtn.disabled = archiveCurrentPage <= 1;
                    nextBtn.disabled = archiveCurrentPage >= totalPages;
                } else {
                    paginationEl.style.display = 'none';
                }
            } else {
                document.getElementById('leadsTableWrapper').style.display = 'none';
            }
        }

        function archiveActivityTitle(a) {

                case 'closed_lost':

        function renderArchiveTimeline(activities) {
            const feed = document.getElementById('timelineFeed');
            if (!feed) return;
            const visible = (activities || []).filter(a => ARCHIVE_TIMELINE_TYPES.includes(a.type))
                .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
            if (!visible.length) {
                feed.innerHTML = '<div class="timeline-empty">' + escapeHtml(t('timelineEmpty')) + '</div>';
                return;
            }
            feed.innerHTML = visible.map(a => {
                const ico = ARCHIVE_ACT_ICO[a.type] || '•';
                const who = a.authorName || roleLabel(a.author) || '—';
                const when = a.createdAt ? new Date(a.createdAt).toLocaleString(currentLang === 'uz' ? 'uz-UZ' : 'ru-RU') : '';
                const body = a.text && String(a.text).trim()
                    ? '<div class="timeline-item__text">' + escapeHtml(String(a.text).trim()) + '</div>' : '';
                return '<div class="timeline-item timeline-item--' + escapeHtml(a.type) + '">'
                    + '<div class="timeline-item__ico" aria-hidden="true">' + ico + '</div>'
                    + '<div class="timeline-item__main">'
                    + '<div class="timeline-item__title">' + escapeHtml(archiveActivityTitle(a)) + '</div>'
                    + body
                    + '<div class="timeline-item__meta">' + escapeHtml(who) + ' · ' + escapeHtml(when) + '</div>'
                    + '</div></div>';
            }).join('');
        }

                    method: 'POST',
                    headers: Object.assign({ 'Content-Type': 'application/json' }, getAuthHeader()),
                    body: JSON.stringify({ comment })
                });

                const data = await response.json();

                if (response.ok) {
                    if (archivedLeadsById[leadId]) {
                        archivedLeadsById[leadId].comment = data.lead.comment;
                    }
                    const commentCell = document.getElementById(`comment-${leadId}`);
                    if (commentCell) {
                        const updatedText = data.lead.comment ? data.lead.comment : t('noComment');
                        commentCell.textContent = updatedText;
                    }
                    closeEditCommentModal();
                } else if (response.status === 403) {
                    showError(t('errorForbidden'));
                } else if (response.status === 401) {
                    sessionStorage.removeItem('authToken');
                    sessionStorage.removeItem('authRole');
                    showError(t('errorSessionExpired'));
                } else {
                    showError(t('errorUpdateComment'));
                }
            } catch (error) {
                console.error('Error updating comment:', error);
                showError(t('errorNetwork'));
            }
        });

        tryRestoreSession();
    </script>
</body>
</html>
