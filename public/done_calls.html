<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Архив — админ‑панель</title>
    <link rel="icon" type="image/png" href="kukcha.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <div class="top-bar-left">
                <div class="lang-switch" aria-label="Language">
                    <span class="lang-label" data-i18n="languageLabel">Язык</span>
                    <div class="lang-toggle-group" role="group" aria-label="Language">
                        <button type="button" class="lang-toggle" data-lang="ru">RU</button>
                        <span class="lang-sep">|</span>
                        <button type="button" class="lang-toggle" data-lang="uz">UZ</button>
                    </div>
                </div>
                <div class="user-menu-wrapper" id="userMenuWrapper" style="display: none;">
                    <button type="button" class="user-menu-trigger" id="userMenuTrigger" title="Аккаунт" data-i18n-title="accountTitle">
                        <svg class="user-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                        <span class="user-role-label" id="userRoleLabel">—</span>
                    </button>
                    <div id="userDropdown" class="user-dropdown" style="display: none;">
                        <button type="button" class="user-dropdown-item logout" id="logoutDropdownBtn" data-i18n="logoutBtn">Выйти</button>
                    </div>
                </div>
            </div>
        </div>
        <!-- Login Section (shown when not authenticated) -->
        <div id="loginSection" class="login-wrapper">
            <div class="login-box">
                <h1 data-i18n="loginTitle">Вход в админ‑панель</h1>
                <p class="subtitle" data-i18n="loginSubtitle">Введите админ‑токен для доступа к архиву</p>
                
                <div id="loginError" class="message error-message" style="display: none;">
                    <p id="loginErrorText"></p>
                </div>

                <form id="loginForm">
                    <div class="form-group">
                        <label for="adminToken" data-i18n="adminTokenLabel">Админ‑токен</label>
                        <input 
                            type="password" 
                            id="adminToken" 
                            name="adminToken" 
                            required 
                            placeholder="Введите админ‑токен"
                            data-i18n-placeholder="adminTokenPlaceholder"
                            autocomplete="off"
                        >
                    </div>
                    <button type="submit" class="submit-btn" data-i18n="loginButton">Войти</button>
                </form>
            </div>
        </div>

        <!-- Done Calls Archive Section (shown when authenticated) -->
        <div id="archivePanel" class="admin-panel" style="display: none;">
            <div class="admin-header">
                <div>
                    <h1 data-i18n="archiveTitle">Архив</h1>
                    <p class="subtitle" data-i18n="archiveSubtitle">Закрытые и архивные лиды</p>
                </div>
                <div class="header-actions">
                    <button type="button" id="archiveExportExcelBtn" class="btn-excel" data-i18n="downloadExcelBtn">Скачать Excel</button>
                    <a class='btn-link' data-i18n='backToActive' href='admin.html'>← Назад к активным</a>
                </div>
            </div>

            <div id="loadingMessage" class="message info-message" style="display: none;">
                <p data-i18n="loadingArchive">Загрузка архива...</p>
            </div>

            <div id="errorMessage" class="message error-message" style="display: none;">
                <p id="errorText"></p>
            </div>

            <div id="noLeadsMessage" class="message info-message" style="display: none;">
                <p data-i18n="noArchive">Архив пуст.</p>
            </div>

            <div class="table-controls-wrapper" id="archiveControlsWrapper" style="margin-bottom: 10px;">
                <button id="archiveControlsToggle" class="controls-toggle" type="button" data-i18n="controlsToggle">Поиск и фильтры</button>
                <div class="header-actions table-controls">
                    <input id="archiveSearchInput" type="text" class="table-search" placeholder="Поиск по имени или телефону" data-i18n-placeholder="searchPlaceholder">
                    <select id="archiveLabelFilter" class="table-select">
                        <option value="" data-i18n="allLabels">Все метки</option>
                        <option value="Call Back" data-i18n="labelCallBack">Перезвонить</option>
                        <option value="Successful" data-i18n="labelSuccessful">Успешно</option>
                        <option value="Rejected" data-i18n="labelRejected">Отказ</option>
                    </select>
                    <button id="archiveDateFilterBtn" class="btn-link" type="button" data-i18n="filterByDateBtn">Фильтр по дате</button>
                    <button id="archiveSortBtn" class="btn-link" type="button" data-i18n="sortBtn">Сортировать</button>
                </div>
            </div>

            <!-- Done Calls Table -->
            <div id="leadsTableWrapper" style="display: none;">
                <div id="archiveCardGrid" class="lead-cards-grid">
                    <!-- Archive cards will be inserted here dynamically -->
                </div>
                <div id="archivePagination" class="pagination" style="display: none;">
                    <button type="button" class="pagination-btn" id="archivePaginationPrev" aria-label="Previous">← <span data-i18n="paginationPrev">Назад</span></button>
                    <span class="pagination-info" id="archivePaginationInfo"></span>
                    <button type="button" class="pagination-btn" id="archivePaginationNext" aria-label="Next"><span data-i18n="paginationNext">Вперёд</span> →</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for Date Filter -->
    <div id="dateFilterModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2 data-i18n="dateFilterTitle">Фильтр по дате</h2>
                <button class="modal-close" id="closeDateFilterModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="dateFilterFrom" data-i18n="dateFilterFrom">С</label>
                    <input type="date" id="dateFilterFrom" name="dateFrom">
                </div>
                <div class="form-group">
                    <label for="dateFilterTo" data-i18n="dateFilterTo">По</label>
                    <input type="date" id="dateFilterTo" name="dateTo">
                </div>
                <div class="form-group form-group--checkbox">
                    <label>
                        <input type="checkbox" id="dateFilterReset" name="dateFilterReset">
                        <span data-i18n="dateFilterReset">Сбросить фильтр</span>
                    </label>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" id="cancelDateFilter" data-i18n="cancelBtn">Отмена</button>
                    <button type="button" class="btn-submit" id="applyDateFilter" data-i18n="applyBtn">Применить</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for Edit Comment -->
    <div id="editCommentModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2 data-i18n="editCommentTitle">Редактировать комментарий</h2>
                <button class="modal-close" id="closeEditCommentModal">&times;</button>
            </div>
            <div class="modal-body">
                <form id="editCommentForm">
                    <input type="hidden" id="editLeadId">
                    <div class="form-group">
                        <label for="editComment" data-i18n="commentLabel">Комментарий</label>
                        <textarea 
                            id="editComment" 
                            name="comment" 
                            rows="4" 
                            placeholder="Введите комментарий"
                            data-i18n-placeholder="commentPlaceholder"
                        ></textarea>
                    </div>
                    <div class="modal-actions">
                        <button type="button" class="btn-cancel" id="cancelEditComment" data-i18n="cancelBtn">Отмена</button>
                        <button type="submit" class="btn-submit" data-i18n="saveBtn">Сохранить</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

        let currentLang = 'ru';
        let dateFilterEnabled = false;
        let dateFilterFrom = '';
        let dateFilterTo = '';
        const ARCHIVE_PAGE_SIZE = 10;
        let archiveCurrentPage = 1;

        function t(key) {
            const dict = translations[currentLang] || translations.ru;
            return dict[key] || '';
        }

        function applyTranslations() {
            document.documentElement.lang = currentLang;
            document.title = t('pageTitle');
            document.querySelectorAll('[data-i18n]').forEach((el) => {
                const key = el.getAttribute('data-i18n');
                el.textContent = t(key);
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach((el) => {
                const key = el.getAttribute('data-i18n-placeholder');
                el.setAttribute('placeholder', t(key));
            });
            document.querySelectorAll('[data-i18n-title]').forEach((el) => {
                const key = el.getAttribute('data-i18n-title');
                el.setAttribute('title', t(key));
            });
            const roleLabel = document.getElementById('userRoleLabel');
            if (roleLabel && userRole) {
                roleLabel.textContent = userRole === 'manager' ? t('roleManager') : t('roleCallManager');
            }
        }

        function setLanguage(lang) {
            currentLang = lang === 'uz' ? 'uz' : 'ru';
            localStorage.setItem(LANG_KEY, currentLang);
            document.querySelectorAll('.lang-toggle').forEach((btn) => {
                btn.classList.toggle('active', btn.getAttribute('data-lang') === currentLang);
            });
            applyTranslations();
            if (adminToken) {
                applyArchiveFilters();
            }
        }

        function initLanguage() {
            const stored = localStorage.getItem(LANG_KEY);
            setLanguage(stored || 'ru');
        }

        function getAuthHeader() {
            return adminToken ? { 'Authorization': 'Bearer ' + adminToken } : {};
        }

        function setRoleUI(role) {
            userRole = role;
            const label = document.getElementById('userRoleLabel');
            const userMenu = document.getElementById('userMenuWrapper');
            label.textContent = role === 'manager' ? t('roleManager') : t('roleCallManager');
            if (userMenu) {
                userMenu.style.display = 'flex';
            }
        }

        // ============================================
        // LOGIN FUNCTIONALITY
        // ============================================

        document.querySelectorAll('.lang-toggle').forEach((btn) => {
            btn.addEventListener('click', () => {
                setLanguage(btn.getAttribute('data-lang'));
            });
        });
        initLanguage();

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const token = document.getElementById('adminToken').value.trim();
            document.getElementById('loginError').style.display = 'none';

            if (!token) {
                showLoginError(t('errorTokenRequired'));
                return;
            }

            try {
                const response = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token })
                });

                const data = await response.json();

                if (response.ok) {
                    adminToken = data.token;
                    userRole = (data.role != null && data.role !== '') ? String(data.role).toLowerCase() : null;
                    sessionStorage.setItem('authToken', data.token);
                    sessionStorage.setItem('authRole', userRole || '');
                    setRoleUI(userRole);
                    document.getElementById('loginSection').style.display = 'none';
                    document.getElementById('archivePanel').style.display = 'block';
                    document.getElementById('adminToken').value = '';
                    applyTranslations();
                    startArchiveSilentRefresh();
                    loadDoneCalls();
                } else {
                    showLoginError(t('errorInvalidToken'));
                }
            } catch (error) {
                console.error('Login error:', error);
                showLoginError(t('errorNetwork'));
            }
        });

        function showLoginError(message) {
            document.getElementById('loginErrorText').textContent = message;
            document.getElementById('loginError').style.display = 'block';
        }

        // ============================================
        // USER MENU & LOGOUT
        // ============================================

        document.getElementById('userMenuTrigger').addEventListener('click', (e) => {
            e.stopPropagation();
            const dropdown = document.getElementById('userDropdown');
            dropdown.style.display = dropdown.style.display === 'none' ? 'block' : 'none';
        });

        document.getElementById('logoutDropdownBtn').addEventListener('click', () => {
            adminToken = null;
            userRole = null;
            sessionStorage.removeItem('authToken');
            sessionStorage.removeItem('authRole');
            stopArchiveSilentRefresh();
            document.getElementById('userDropdown').style.display = 'none';
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('archivePanel').style.display = 'none';
            document.getElementById('archiveCardGrid').innerHTML = '';
            const userMenu = document.getElementById('userMenuWrapper');
            if (userMenu) {
                userMenu.style.display = 'none';
            }
        });

        document.addEventListener('click', () => {
            document.getElementById('userDropdown').style.display = 'none';
        });

        function tryRestoreSession() {
            const token = sessionStorage.getItem('authToken');
            if (!token) return;
            adminToken = token;
            const storedRole = sessionStorage.getItem('authRole');
            userRole = (storedRole != null && storedRole !== '') ? String(storedRole).toLowerCase() : null;
            setRoleUI(userRole);
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('archivePanel').style.display = 'block';
            applyTranslations();
            startArchiveSilentRefresh();
            loadDoneCalls();
        }

        // ============================================
        // LOAD DONE CALLS
        // ============================================

        async function loadDoneCalls() {
            if (!adminToken) return;

            document.getElementById('loadingMessage').style.display = 'block';
            document.getElementById('errorMessage').style.display = 'none';
            document.getElementById('noLeadsMessage').style.display = 'none';
            document.getElementById('leadsTableWrapper').style.display = 'none';

            try {
                let url = '/api/admin/done-calls';
                if (dateFilterEnabled && (dateFilterFrom || dateFilterTo)) {
                    const params = new URLSearchParams();
                    if (dateFilterFrom) params.set('dateFrom', dateFilterFrom);
                    if (dateFilterTo) params.set('dateTo', dateFilterTo);
                    url += '?' + params.toString();
                }
                const response = await fetch(url, {
                    method: 'GET',
                    headers: getAuthHeader()
                });

                const data = await response.json();

                document.getElementById('loadingMessage').style.display = 'none';

                if (response.ok) {
                    allArchiveLeads = data.leads || [];
                    archiveCurrentPage = 1;
                    if (allArchiveLeads.length > 0) {
                        applyArchiveFilters();
                    } else {
                        document.getElementById('noLeadsMessage').style.display = 'block';
                        document.getElementById('leadsTableWrapper').style.display = 'none';
                    }
                } else {
                    if (response.status === 401) {
                        showError(t('errorSessionExpired'));
                        sessionStorage.removeItem('authToken');
                        sessionStorage.removeItem('authRole');
                        setTimeout(() => {
                            adminToken = null;
                            document.getElementById('loginSection').style.display = 'block';
                            document.getElementById('archivePanel').style.display = 'none';
                            const userMenu = document.getElementById('userMenuWrapper');
                            if (userMenu) {
                                userMenu.style.display = 'none';
                            }
                        }, 2000);
                    } else {
                        showError(t('errorLoadArchive'));
                    }
                }
            } catch (error) {
                console.error('Error loading archive:', error);
                document.getElementById('loadingMessage').style.display = 'none';
                showError(t('errorNetwork'));
            }
        }

        function roleLabel(role) {
            if (role === 'manager') return t('roleManager');
            if (role === 'call_manager') return t('roleCallManager');
            return '—';
        }

        function getLabelClass(label) {
            switch (label) {
                case 'Call Back':
                    return 'badge-call-back';
                case 'Successful':
                    return 'badge-successful';
                case 'Rejected':
                    return 'badge-rejected';
                default:
                    return 'badge-new';
            }
        }

        function renderLabelBadge(label) {
            const safeLabel = escapeHtml(getLabelDisplay(label || 'New Client'));
            const cls = getLabelClass(label);
            return `<span class="badge ${cls}">${safeLabel}</span>`;
        }

        function getLabelDisplay(label) {
            switch (label) {
                case 'Call Back':
                    return t('labelCallBack');
                case 'Successful':
                    return t('labelSuccessful');
                case 'Rejected':
                    return t('labelRejected');
                default:
                    return t('labelNew');
            }
        }

        function getSourceClass(source) {
            switch (source) {
                case 'instagram':
                    return 'badge-source badge-instagram';
                case 'telegram':
                    return 'badge-source badge-telegram';
                case 'word_of_mouth':
                    return 'badge-source badge-word';
                default:
                    return 'badge-source badge-website';
            }
        }

        function getSourceDisplay(source) {
            switch (source) {
                case 'instagram':
                    return t('sourceInstagram');
                case 'telegram':
                    return t('sourceTelegram');
                case 'word_of_mouth':
                    return t('sourceWordOfMouth');
                default:
                    return t('sourceWebsite');
            }
        }

        function renderSourceBadge(source) {
            const safeLabel = escapeHtml(getSourceDisplay(source || 'website'));
            const cls = getSourceClass(source);
            return `<span class="badge ${cls}">${safeLabel}</span>`;
        }

        function buildArchiveCardHTML(lead, index) {
            const dateClosed = lead.closedAt || lead.updatedAt || lead.createdAt;
            const formattedDate = new Date(dateClosed).toLocaleString();
            const fullName = lead.fullName || (lead.name + ' ' + lead.surname).trim() || '—';
            const comment = lead.comment || t('noComment');
            const closedBy = roleLabel(lead.closedBy);
            const labelBadge = renderLabelBadge(lead.label || 'New Client');
            const sourceBadge = renderSourceBadge(lead.source || 'website');
            return `
                <div class="lead-card-header">
                    <div class="lead-card-name">${escapeHtml(fullName)}</div>
                    <div class="lead-card-source">${sourceBadge}</div>
                </div>
                <div class="lead-card-meta">
                    <div class="lead-card-phone">${escapeHtml(lead.phoneNumber)}</div>
                    <div class="lead-card-label">${labelBadge}</div>
                </div>
                <div class="lead-card-details">
                    <div class="lead-field">
                        <span class="field-label">${t('thClosedBy')}</span>
                        <span class="field-value">${escapeHtml(closedBy)}</span>
                    </div>
                    <div class="lead-field">
                        <span class="field-label">${t('thClosedAt')}</span>
                        <span class="field-value">${escapeHtml(formattedDate)}</span>
                    </div>
                </div>
                <div class="lead-card-comment">
                    <div class="field-label">${t('thComment')}</div>
                    <div class="comment-text" id="comment-${lead._id}">${escapeHtml(comment)}</div>
                </div>
                <div class="lead-card-actions">
                    <button class="btn-edit" data-id="${lead._id}">${t('editBtn')}</button>
                </div>
            `;
        }

        function createArchiveCardElement(lead, index) {
            const card = document.createElement('div');
            card.className = 'lead-card card-animate';
            card.setAttribute('data-lead-id', lead._id);
            card.style.animationDelay = `${index * 0.05}s`;
            card.innerHTML = buildArchiveCardHTML(lead, index);
            return card;
        }

        function displayDoneCalls(leads) {
            const grid = document.getElementById('archiveCardGrid');
            grid.innerHTML = '';
            archivedLeadsById = {};
            leads.forEach((lead, index) => {
                archivedLeadsById[lead._id] = lead;
                const card = createArchiveCardElement(lead, index);
                grid.appendChild(card);
            });
            document.getElementById('leadsTableWrapper').style.display = 'block';
        }

        function syncArchiveDOM(pageLeads) {
            const grid = document.getElementById('archiveCardGrid');
            if (!grid) return;
            pageLeads.forEach(l => { archivedLeadsById[l._id] = l; });
            const wantedIds = new Set(pageLeads.map(l => l._id));
            for (const card of [...grid.children]) {
                const id = card.getAttribute('data-lead-id');
                if (id && !wantedIds.has(id)) card.remove();
            }
            for (let i = 0; i < pageLeads.length; i++) {
                const lead = pageLeads[i];
                const existing = grid.querySelector(`[data-lead-id="${lead._id}"]`);
                if (existing) {
                    existing.innerHTML = buildArchiveCardHTML(lead, i);
                    if (existing !== grid.children[i]) grid.insertBefore(existing, grid.children[i] || null);
                } else {
                    const card = createArchiveCardElement(lead, i);
                    grid.insertBefore(card, grid.children[i] || null);
                }
            }
        }

        const ARCHIVE_SILENT_REFRESH_INTERVAL_MS = 30000;
        let archiveSilentRefreshIntervalId = null;

        async function silentRefreshArchive() {
            if (!adminToken) return;
            let url = '/api/admin/done-calls';
            if (dateFilterEnabled && (dateFilterFrom || dateFilterTo)) {
                const params = new URLSearchParams();
                if (dateFilterFrom) params.set('dateFrom', dateFilterFrom);
                if (dateFilterTo) params.set('dateTo', dateFilterTo);
                url += '?' + params.toString();
            }
            try {
                const response = await fetch(url, { method: 'GET', headers: getAuthHeader() });
                const data = await response.json();
                if (!response.ok) return;
                allArchiveLeads = data.leads || [];
                const filtered = getFilteredArchiveLeads();
                const totalPages = Math.max(1, Math.ceil(filtered.length / ARCHIVE_PAGE_SIZE));
                if (archiveCurrentPage > totalPages) archiveCurrentPage = totalPages;
                const start = (archiveCurrentPage - 1) * ARCHIVE_PAGE_SIZE;
                const pageLeads = filtered.slice(start, start + ARCHIVE_PAGE_SIZE);
                syncArchiveDOM(pageLeads);
                const paginationEl = document.getElementById('archivePagination');
                const infoEl = document.getElementById('archivePaginationInfo');
                const prevBtn = document.getElementById('archivePaginationPrev');
                const nextBtn = document.getElementById('archivePaginationNext');
                if (totalPages > 1 && paginationEl && infoEl) {
                    paginationEl.style.display = 'flex';
                    infoEl.textContent = (t('paginationPage') || 'Стр. {{current}} из {{total}}').replace('{{current}}', String(archiveCurrentPage)).replace('{{total}}', String(totalPages));
                    if (prevBtn) prevBtn.disabled = archiveCurrentPage <= 1;
                    if (nextBtn) nextBtn.disabled = archiveCurrentPage >= totalPages;
                } else if (paginationEl) paginationEl.style.display = 'none';
                document.getElementById('noLeadsMessage').style.display = filtered.length === 0 ? 'block' : 'none';
                if (filtered.length === 0) document.getElementById('leadsTableWrapper').style.display = 'none';
            } catch (e) { /* silent */ }
        }

        function startArchiveSilentRefresh() {
            if (archiveSilentRefreshIntervalId) clearInterval(archiveSilentRefreshIntervalId);
            archiveSilentRefreshIntervalId = setInterval(silentRefreshArchive, ARCHIVE_SILENT_REFRESH_INTERVAL_MS);
        }

        function stopArchiveSilentRefresh() {
            if (archiveSilentRefreshIntervalId) {
                clearInterval(archiveSilentRefreshIntervalId);
                archiveSilentRefreshIntervalId = null;
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showError(message) {
            document.getElementById('errorText').textContent = message;
            document.getElementById('errorMessage').style.display = 'block';
        }

        function getFilteredArchiveLeads() {
            const searchInput = document.getElementById('archiveSearchInput');
            const labelSelect = document.getElementById('archiveLabelFilter');
            const query = searchInput ? searchInput.value.trim().toLowerCase() : '';
            const label = labelSelect ? labelSelect.value : '';
            let filtered = allArchiveLeads;
            if (label) filtered = filtered.filter(lead => (lead.label || '') === label);
            if (query) {
                filtered = filtered.filter(lead => {
                    const fullName = (lead.fullName || (lead.name + ' ' + lead.surname).trim() || '').toLowerCase();
                    const phone = (lead.phoneNumber || '').toLowerCase();
                    return fullName.includes(query) || phone.includes(query);
                });
            }
            return filtered;
        }

        function applyArchiveFilters() {
            const filtered = getFilteredArchiveLeads();
            const totalPages = Math.max(1, Math.ceil(filtered.length / ARCHIVE_PAGE_SIZE));
            if (archiveCurrentPage > totalPages) archiveCurrentPage = totalPages;
            const start = (archiveCurrentPage - 1) * ARCHIVE_PAGE_SIZE;
            const pageLeads = filtered.slice(start, start + ARCHIVE_PAGE_SIZE);

            document.getElementById('noLeadsMessage').style.display = filtered.length === 0 ? 'block' : 'none';
            if (filtered.length > 0) {
                displayDoneCalls(pageLeads);
                const paginationEl = document.getElementById('archivePagination');
                const infoEl = document.getElementById('archivePaginationInfo');
                const prevBtn = document.getElementById('archivePaginationPrev');
                const nextBtn = document.getElementById('archivePaginationNext');
                if (totalPages > 1) {
                    paginationEl.style.display = 'flex';
                    infoEl.textContent = (t('paginationPage') || 'Стр. {{current}} из {{total}}')
                        .replace('{{current}}', String(archiveCurrentPage))
                        .replace('{{total}}', String(totalPages));
                    prevBtn.disabled = archiveCurrentPage <= 1;
                    nextBtn.disabled = archiveCurrentPage >= totalPages;
                } else {
                    paginationEl.style.display = 'none';
                }
            } else {
                document.getElementById('leadsTableWrapper').style.display = 'none';
            }
        }

        document.getElementById('archiveSortBtn').addEventListener('click', () => {
            archiveCurrentPage = 1;
            applyArchiveFilters();
        });

        document.getElementById('archiveSearchInput').addEventListener('input', () => {
            archiveCurrentPage = 1;
            applyArchiveFilters();
        });

        document.getElementById('archiveLabelFilter').addEventListener('change', () => {
            archiveCurrentPage = 1;
            applyArchiveFilters();
        });

        document.getElementById('archivePaginationPrev').addEventListener('click', () => {
            if (archiveCurrentPage > 1) {
                archiveCurrentPage--;
                applyArchiveFilters();
            }
        });
        document.getElementById('archivePaginationNext').addEventListener('click', () => {
            const filtered = getFilteredArchiveLeads();
            const totalPages = Math.max(1, Math.ceil(filtered.length / ARCHIVE_PAGE_SIZE));
            if (archiveCurrentPage < totalPages) {
                archiveCurrentPage++;
                applyArchiveFilters();
            }
        });

        function openDateFilterModal() {
            document.getElementById('dateFilterFrom').value = dateFilterFrom || '';
            document.getElementById('dateFilterTo').value = dateFilterTo || '';
            document.getElementById('dateFilterReset').checked = false;
            const modal = document.getElementById('dateFilterModal');
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('modal-open'), 10);
        }
        function closeDateFilterModal() {
            const modal = document.getElementById('dateFilterModal');
            modal.classList.remove('modal-open');
            setTimeout(() => { modal.style.display = 'none'; }, 300);
        }
        document.getElementById('archiveDateFilterBtn').addEventListener('click', openDateFilterModal);
        document.getElementById('closeDateFilterModal').addEventListener('click', closeDateFilterModal);
        document.getElementById('cancelDateFilter').addEventListener('click', closeDateFilterModal);
        document.getElementById('applyDateFilter').addEventListener('click', () => {
            const resetFilter = document.getElementById('dateFilterReset').checked;
            if (resetFilter) {
                dateFilterEnabled = false;
                dateFilterFrom = '';
                dateFilterTo = '';
            } else {
                const from = document.getElementById('dateFilterFrom').value.trim();
                const to = document.getElementById('dateFilterTo').value.trim();
                dateFilterEnabled = !!(from || to);
                dateFilterFrom = from;
                dateFilterTo = to;
            }
            closeDateFilterModal();
            archiveCurrentPage = 1;
            loadDoneCalls();
        });
        document.getElementById('dateFilterModal').addEventListener('click', (e) => {
            if (e.target.id === 'dateFilterModal') closeDateFilterModal();
        });

        document.getElementById('archiveExportExcelBtn').addEventListener('click', async () => {
            if (!adminToken) return;
            let url = '/api/admin/archive/export';
            if (dateFilterEnabled && (dateFilterFrom || dateFilterTo)) {
                const params = new URLSearchParams();
                if (dateFilterFrom) params.set('dateFrom', dateFilterFrom);
                if (dateFilterTo) params.set('dateTo', dateFilterTo);
                url += '?' + params.toString();
            }
            try {
                const response = await fetch(url, { headers: getAuthHeader() });
                if (!response.ok) throw new Error('Export failed');
                const blob = await response.blob();
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'archive-export.xlsx';
                a.click();
                URL.revokeObjectURL(a.href);
            } catch (err) {
                console.error('Excel export error:', err);
                showError(t('errorLoadArchive'));
            }
        });

        document.getElementById('archiveControlsToggle').addEventListener('click', () => {
            const wrapper = document.getElementById('archiveControlsWrapper');
            if (wrapper) {
                wrapper.classList.toggle('controls-open');
            }
        });

        document.getElementById('archiveCardGrid').addEventListener('click', (e) => {
            if (e.target.classList.contains('btn-edit')) {
                const leadId = e.target.getAttribute('data-id');
                const lead = archivedLeadsById[leadId];
                if (!lead) return;
                document.getElementById('editLeadId').value = leadId;
                document.getElementById('editComment').value = lead.comment || '';
                const modal = document.getElementById('editCommentModal');
                modal.style.display = 'flex';
                setTimeout(() => {
                    modal.classList.add('modal-open');
                }, 10);
            }
        });

        function closeEditCommentModal() {
            const modal = document.getElementById('editCommentModal');
            modal.classList.remove('modal-open');
            setTimeout(() => {
                modal.style.display = 'none';
            }, 300);
        }

        document.getElementById('closeEditCommentModal').addEventListener('click', closeEditCommentModal);
        document.getElementById('cancelEditComment').addEventListener('click', closeEditCommentModal);
        document.getElementById('editCommentModal').addEventListener('click', (e) => {
            if (e.target.id === 'editCommentModal') closeEditCommentModal();
        });

        document.getElementById('editCommentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const leadId = document.getElementById('editLeadId').value;
            const comment = document.getElementById('editComment').value.trim();

            try {
                const response = await fetch(`/api/admin/leads/${leadId}/comment`, {
                    method: 'POST',
                    headers: Object.assign({ 'Content-Type': 'application/json' }, getAuthHeader()),
                    body: JSON.stringify({ comment })
                });

                const data = await response.json();

                if (response.ok) {
                    if (archivedLeadsById[leadId]) {
                        archivedLeadsById[leadId].comment = data.lead.comment;
                    }
                    const commentCell = document.getElementById(`comment-${leadId}`);
                    if (commentCell) {
                        const updatedText = data.lead.comment ? data.lead.comment : t('noComment');
                        commentCell.textContent = updatedText;
                    }
                    closeEditCommentModal();
                } else if (response.status === 403) {
                    showError(t('errorForbidden'));
                } else if (response.status === 401) {
                    sessionStorage.removeItem('authToken');
                    sessionStorage.removeItem('authRole');
                    showError(t('errorSessionExpired'));
                } else {
                    showError(t('errorUpdateComment'));
                }
            } catch (error) {
                console.error('Error updating comment:', error);
                showError(t('errorNetwork'));
            }
        });

        tryRestoreSession();
    </script>
</body>
</html>
