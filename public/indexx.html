
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Junior</title>
</head>
<style>
    body {
        font-family: sans-serif;
        display: flex;
        justify-content:
            center;
        padding: 50px;
    }

    form {
        border: 1px solid red;
        padding: 20px;
        border-radius: 10px;
        width: 300px;
    }

    input {
        width: 100%;
        margin: 10px 0;
        padding: 8px;
        box-sizing: border-box;
    }

    .btn {
        background-color: #007bff;
        color: white;
        border: none;
        cursor: pointer;
    }
</style>

<body>
    <!-- Kodlaringizni shu yerda yozing -->

    <form id="regForm">
        <h2>Ro'yxatdan o'tish</h2>

        <label>Ismingiz</label>
        <input type="text" id="name" placeholder="Ism yozing">

        <label>Email</label>
        <input type="email" id="email" placeholder="Email yozing">

        <label>Parol</label>
        <input type="password" id="password" placeholder="Parol kiriting">

        <input type="submit" value="Yuborish" class="btn">
    </form>

    <script>
        const form = document.getElementById('regForm');

        form.addEventListener('submit', function(event) {
            event.preventDefault(); 

            const ism = document.getElementById('name').value;
            const email = document.querySelector('#email').value;
            const parol = document.getElementById('password').value;

            console.log("Ism:", ism);
            console.log("Email:", email);
            console.log("Parol:", parol);
            
            alert("Ma'lumotlar konsolga yuborildi!");
        });
    </script>


</body>

</html>
