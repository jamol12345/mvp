<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Свяжитесь с нами</title>
    <link rel="icon" type="image/png" href="kukcha.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="page-fade-in">
    <div class="container">
        <div class="lang-switch" aria-label="Language">
            <span class="lang-label" data-i18n="languageLabel">Язык</span>
            <div class="lang-toggle-group" role="group" aria-label="Language">
                <button type="button" class="lang-toggle" data-lang="ru">RU</button>
                <span class="lang-sep">|</span>
                <button type="button" class="lang-toggle" data-lang="uz">UZ</button>
            </div>
        </div>
        <div class="form-wrapper glass fade-in-up">
            <h1 data-i18n="title">Свяжитесь с нами</h1>
            <p class="subtitle" data-i18n="subtitle">Заполните форму, и мы свяжемся с вами в ближайшее время!</p>
            
            <!-- Error Message (hidden by default) -->
            <div id="errorMessage" class="message error-message slide-in-top" style="display: none;">
                <p id="errorText"></p>
            </div>

            <!-- Contact Form -->
            <form id="contactForm">
                <div class="form-group">
                    <label for="fullName"><span data-i18n="fullNameLabel">ФИО</span> <span class="required">*</span></label>
                    <input 
                        type="text" 
                        id="fullName" 
                        name="fullName" 
                        class="glass-input"
                        required 
                        placeholder="Введите ФИО"
                        data-i18n-placeholder="fullNamePlaceholder"
                    >
                </div>

                <div class="form-group">
                    <label for="doorType"><span data-i18n="doorTypeLabel">Выбранная дверь</span> <span class="required">*</span></label>
                    <select id="doorType" name="doorType" class="glass-input" required>
                        <option value="" data-i18n="doorTypePlaceholder">Выберите тип двери</option>
                        <option value="Standard Door" data-i18n="doorTypeStandard">Стандартная дверь</option>
                        <option value="Premium Door" data-i18n="doorTypePremium">Премиум дверь</option>
                        <option value="Custom Door" data-i18n="doorTypeCustom">Индивидуальная дверь</option>
                    </select>
                </div>

                <div class="form-row form-row--length-width">
                    <div class="form-group">
                        <label for="length"><span data-i18n="lengthLabel">Длина</span> <span class="required">*</span></label>
                        <input type="number" id="length" name="length" class="glass-input" required min="1" step="1" placeholder="см" data-i18n-placeholder="lengthPlaceholder">
                    </div>
                    <div class="form-group">
                        <label for="width"><span data-i18n="widthLabel">Ширина</span> <span class="required">*</span></label>
                        <input type="number" id="width" name="width" class="glass-input" required min="1" step="1" placeholder="см" data-i18n-placeholder="widthPlaceholder">
                    </div>
                </div>
                <div class="form-group">
                    <label for="dobor"><span data-i18n="doborLabel">Добор</span></label>
                    <input type="text" id="dobor" name="dobor" class="glass-input" placeholder="" data-i18n-placeholder="doborPlaceholder">
                </div>

                <div class="form-group">
                    <label data-i18n="prioritiesLabel">Что для вас важнее всего?</label> <span class="required">*</span>
                    <p class="priority-hint" data-i18n="priorityHint">Выберите ровно 2 варианта</p>
                    <div class="priority-buttons priority-buttons--checkboxes" id="priorityButtons" role="group" aria-label="Приоритет">
                        <button type="button" class="priority-btn priority-btn--check" data-value="Качество и надежность" data-i18n="priorityQuality">Качество и надежность</button>
                        <button type="button" class="priority-btn priority-btn--check" data-value="Цена" data-i18n="priorityPrice">Цена</button>
                        <button type="button" class="priority-btn priority-btn--check" data-value="Дизайн и стиль" data-i18n="priorityDesignStyle">Дизайн и стиль</button>
                        <button type="button" class="priority-btn priority-btn--check" data-value="Гарантии и сервис" data-i18n="priorityWarrantyService">Гарантии и сервис</button>
                        <button type="button" class="priority-btn priority-btn--check" data-value="Надежность и безопасность" data-i18n="prioritySafety">Надежность и безопасность</button>
                    </div>
                    <p id="priorityError" class="field-error" style="display: none;" data-i18n="errorPriorityRequired"></p>
                </div>

                <div class="form-group">
                    <label for="phoneNumber"><span data-i18n="phoneLabel">Телефон</span> <span class="required">*</span></label>
                    <input 
                        type="tel" 
                        id="phoneNumber" 
                        name="phoneNumber" 
                        class="glass-input"
                        required 
                        placeholder="Введите телефон"
                        data-i18n-placeholder="phonePlaceholder"
                    >
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">
                    <span id="submitText" data-i18n="submitBtn">Отправить</span>
                    <span id="submitSpinner" class="spinner" style="display: none;"></span>
                </button>
            </form>
        </div>
    </div>

    <!-- Success modal (animated) -->
    <div id="successModal" class="modal" style="display: none;">
        <div class="modal-content glass success-modal-content">
            <div class="modal-body">
                <p class="success-modal-text" data-i18n="successMessage">Ваши данные успешно отправлены.<br>Мы свяжемся с вами в течение 24 часов.</p>
            </div>
        </div>
    </div>

    <script>
        const submitBtn = document.getElementById('submitBtn');
        const submitText = document.getElementById('submitText');
        const submitSpinner = document.getElementById('submitSpinner');
        let isSubmitting = false;
        let currentLang = 'ru';

        const LANG_KEY = 'crm_lang';
        const translations = {
            ru: {
                languageLabel: 'Язык',
                title: 'Свяжитесь с нами',
                subtitle: 'Заполните форму, и мы свяжемся с вами в ближайшее время!',
                fullNameLabel: 'ФИО',
                fullNamePlaceholder: 'Введите ФИО',
                doorTypeLabel: 'Выбранная дверь',
                doorTypePlaceholder: 'Выберите тип двери',
                doorTypeStandard: 'Стандартная дверь',
                doorTypePremium: 'Премиум дверь',
                doorTypeCustom: 'Индивидуальная дверь',
                lengthLabel: 'Длина',
                lengthPlaceholder: 'см',
                widthLabel: 'Ширина',
                widthPlaceholder: 'см',
                doborLabel: 'Добор',
                doborPlaceholder: 'необязательно',
                prioritiesLabel: 'Что для вас важнее всего?',
                priorityHint: 'Выберите ровно 2 варианта',
                priorityQuality: 'Качество и надежность',
                priorityPrice: 'Цена',
                priorityDesignStyle: 'Дизайн и стиль',
                priorityWarrantyService: 'Гарантии и сервис',
                prioritySafety: 'Надежность и безопасность',
                errorPriorityRequired: 'Выберите ровно 2 приоритета.',
                phoneLabel: 'Телефон',
                phonePlaceholder: 'Введите телефон',
                submitBtn: 'Отправить',
                successMessage: 'Ваши данные успешно отправлены.<br>Мы свяжемся с вами в течение 24 часов.',
                errorRequired: 'Пожалуйста, заполните все обязательные поля.',
                errorLengthRequired: 'Введите корректную длину (число больше 0).',
                errorWidthRequired: 'Введите корректную ширину (число больше 0).',
                errorNetwork: 'Ошибка сети. Проверьте соединение и попробуйте снова.',
                errorGeneric: 'Произошла ошибка. Попробуйте снова.'
            },
            uz: {
                languageLabel: 'Til',
                title: 'Biz bilan bog‘laning',
                subtitle: 'Formani to‘ldiring, biz tez orada siz bilan bog‘lanamiz!',
                fullNameLabel: 'F.I.Sh.',
                fullNamePlaceholder: 'F.I.Sh. kiriting',
                doorTypeLabel: 'Tanlangan eshik',
                doorTypePlaceholder: 'Eshik turini tanlang',
                doorTypeStandard: 'Standart eshik',
                doorTypePremium: 'Premium eshik',
                doorTypeCustom: 'Individual eshik',
                lengthLabel: 'Uzunlik',
                lengthPlaceholder: 'sm',
                widthLabel: 'Kenglik',
                widthPlaceholder: 'sm',
                doborLabel: 'Dobor',
                doborPlaceholder: 'ixtiyoriy',
                prioritiesLabel: 'Siz uchun eng muhim narsa nima?',
                priorityHint: 'Aniq 2 ta variantni tanlang',
                priorityQuality: 'Sifat va ishonchlilik',
                priorityPrice: 'Narx',
                priorityDesignStyle: 'Dizayn va uslub',
                priorityWarrantyService: 'Kafolat va xizmat',
                prioritySafety: 'Ishonchlilik va xavfsizlik',
                errorPriorityRequired: 'Aniq 2 ta ustuvorlikni tanlang.',
                phoneLabel: 'Telefon',
                phonePlaceholder: 'Telefon raqamini kiriting',
                submitBtn: 'Yuborish',
                successMessage: 'Ma’lumotlaringiz muvaffaqiyatli yuborildi.<br>24 soat ichida siz bilan bog‘lanamiz.',
                errorRequired: 'Iltimos, barcha majburiy maydonlarni to‘ldiring.',
                errorLengthRequired: 'To‘g‘ri uzunlikni kiriting (0 dan katta son).',
                errorWidthRequired: 'To‘g‘ri kenglikni kiriting (0 dan katta son).',
                errorNetwork: 'Tarmoq xatosi. Ulanishni tekshirib qayta urinib ko‘ring.',
                errorGeneric: 'Xatolik yuz berdi. Qayta urinib ko‘ring.'
            }
        };

        function t(key) {
            const dict = translations[currentLang] || translations.ru;
            return dict[key] || '';
        }

        function applyTranslations() {
            document.documentElement.lang = currentLang;
            document.title = t('title');
            document.querySelectorAll('[data-i18n]').forEach((el) => {
                const key = el.getAttribute('data-i18n');
                el.innerHTML = t(key);
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach((el) => {
                const key = el.getAttribute('data-i18n-placeholder');
                el.setAttribute('placeholder', t(key));
            });
        }

        function setLanguage(lang) {
            currentLang = lang === 'uz' ? 'uz' : 'ru';
            localStorage.setItem(LANG_KEY, currentLang);
            document.querySelectorAll('.lang-toggle').forEach((btn) => {
                btn.classList.toggle('active', btn.getAttribute('data-lang') === currentLang);
            });
            applyTranslations();
        }

        function getApiBase() {
            const host = window.location.hostname;
            if (host === 'localhost' || host === '127.0.0.1') {
                return '';
            }
            return 'https://kukcha-backend.vercel.app';
        }

        function initLanguage() {
            const stored = localStorage.getItem(LANG_KEY);
            setLanguage(stored || 'ru');
        }

        document.querySelectorAll('.lang-toggle').forEach((btn) => {
            btn.addEventListener('click', () => {
                setLanguage(btn.getAttribute('data-lang'));
            });
        });
        initLanguage();

        // Priority: exactly 2 choices (checkbox-style buttons)
        document.getElementById('priorityButtons').addEventListener('click', (e) => {
            const btn = e.target.closest('.priority-btn');
            if (!btn) return;
            const container = document.getElementById('priorityButtons');
            const all = container.querySelectorAll('.priority-btn');
            const selected = container.querySelectorAll('.priority-btn.active');
            if (btn.classList.contains('active')) {
                btn.classList.remove('active');
            } else if (selected.length < 2) {
                btn.classList.add('active');
            }
            const nowSelected = container.querySelectorAll('.priority-btn.active');
            all.forEach(b => {
                b.classList.toggle('priority-btn--disabled', !b.classList.contains('active') && nowSelected.length >= 2);
            });
        });

        // Handle form submission
        document.getElementById('contactForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            // Prevent multiple submissions
            if (isSubmitting) {
                return;
            }

            document.getElementById('errorMessage').style.display = 'none';
            document.getElementById('priorityError').style.display = 'none';

            const priorityBtns = document.querySelectorAll('#priorityButtons .priority-btn.active');
            const prioritiesArray = Array.from(priorityBtns).map(b => (b.getAttribute('data-value') || '').trim()).filter(Boolean);

            if (prioritiesArray.length !== 2) {
                document.getElementById('priorityError').textContent = t('errorPriorityRequired') || 'Выберите ровно 2 приоритета.';
                document.getElementById('priorityError').style.display = 'block';
                return;
            }

            const lengthRaw = document.getElementById('length').value.trim();
            const widthRaw = document.getElementById('width').value.trim();
            const lengthNum = lengthRaw === '' ? NaN : Number(lengthRaw);
            const widthNum = widthRaw === '' ? NaN : Number(widthRaw);
            if (typeof lengthNum !== 'number' || isNaN(lengthNum) || lengthNum <= 0 || !/^\d*\.?\d*$/.test(lengthRaw)) {
                showError(t('errorLengthRequired') || 'Введите корректную длину (число больше 0).');
                return;
            }
            if (typeof widthNum !== 'number' || isNaN(widthNum) || widthNum <= 0 || !/^\d*\.?\d*$/.test(widthRaw)) {
                showError(t('errorWidthRequired') || 'Введите корректную ширину (число больше 0).');
                return;
            }

            const dobor = document.getElementById('dobor').value.trim();
            const formData = {
                fullName: document.getElementById('fullName').value.trim(),
                doorType: document.getElementById('doorType').value,
                measurements: lengthNum + ' x ' + widthNum,
                length: lengthNum,
                width: widthNum,
                dobor: dobor,
                phoneNumber: document.getElementById('phoneNumber').value.trim(),
                priorities: prioritiesArray,
                language: currentLang
            };

            if (!formData.fullName || !formData.doorType || !formData.phoneNumber) {
                showError(t('errorRequired'));
                return;
            }

            setLoadingState(true);

            try {
                const response = await fetch(getApiBase() + '/api/leads', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (response.ok) {
                    document.getElementById('contactForm').reset();
                    document.querySelectorAll('#priorityButtons .priority-btn').forEach(b => b.classList.remove('active'));
                    showSuccessModal();
                } else {
                    showError(t('errorGeneric'));
                }
            } catch (error) {
                console.error('Error:', error);
                showError(t('errorNetwork'));
            } finally {
                setLoadingState(false);
            }
        });

        // Set loading state on submit button
        function setLoadingState(loading) {
            isSubmitting = loading;
            submitBtn.disabled = loading;
            
            if (loading) {
                submitText.style.display = 'none';
                submitSpinner.style.display = 'inline-block';
                submitBtn.classList.add('loading');
            } else {
                submitText.style.display = 'inline';
                submitSpinner.style.display = 'none';
                submitBtn.classList.remove('loading');
            }
        }

        function showError(message) {
            const errorMsg = document.getElementById('errorMessage');
            document.getElementById('errorText').textContent = message;
            errorMsg.style.display = 'block';
            errorMsg.classList.add('slide-in-top');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function showSuccessModal() {
            const modal = document.getElementById('successModal');
            modal.style.display = 'flex';
            setTimeout(function() {
                modal.classList.add('modal-open');
            }, 10);
        }

        function closeSuccessModal() {
            const modal = document.getElementById('successModal');
            modal.classList.remove('modal-open');
            setTimeout(function() {
                modal.style.display = 'none';
            }, 300);
        }

        document.getElementById('successModal').addEventListener('click', function(e) {
            if (e.target.id === 'successModal') {
                closeSuccessModal();
            }
        });
    </script>
</body>
</html>
