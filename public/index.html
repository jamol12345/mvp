<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="page-fade-in">
    <div class="container">
        <div class="form-wrapper fade-in-up">
            <h1>Contact Us</h1>
            <p class="subtitle">Fill out the form below and we'll get back to you soon!</p>
            
            <!-- Error Message (hidden by default) -->
            <div id="errorMessage" class="message error-message slide-in-top" style="display: none;">
                <p id="errorText"></p>
            </div>

            <!-- Contact Form -->
            <form id="contactForm">
                <div class="form-group">
                    <label for="fullName">Full name (FIO) <span class="required">*</span></label>
                    <input 
                        type="text" 
                        id="fullName" 
                        name="fullName" 
                        required 
                        placeholder="Enter your full name"
                    >
                </div>

                <div class="form-group">
                    <label for="doorType">Selected door <span class="required">*</span></label>
                    <select id="doorType" name="doorType" required>
                        <option value="">Choose door type</option>
                        <option value="Standard Door">Standard Door</option>
                        <option value="Premium Door">Premium Door</option>
                        <option value="Custom Door">Custom Door</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="measurements">Measurements <span class="required">*</span></label>
                    <input 
                        type="text" 
                        id="measurements" 
                        name="measurements" 
                        required 
                        placeholder="e.g. 9x20"
                    >
                </div>

                <div class="form-group">
                    <label>What is most important to you? <span class="required">*</span></label>
                    <div class="priority-buttons" id="priorityButtons">
                        <button type="button" class="priority-btn" data-value="Quality">Quality</button>
                        <button type="button" class="priority-btn" data-value="Design">Design</button>
                        <button type="button" class="priority-btn" data-value="Production Time">Production Time</button>
                        <button type="button" class="priority-btn" data-value="Price">Price</button>
                        <button type="button" class="priority-btn" data-value="Warranty">Warranty</button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="phoneNumber">Phone number <span class="required">*</span></label>
                    <input 
                        type="tel" 
                        id="phoneNumber" 
                        name="phoneNumber" 
                        required 
                        placeholder="Enter your phone number"
                    >
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">
                    <span id="submitText">Submit</span>
                    <span id="submitSpinner" class="spinner" style="display: none;"></span>
                </button>
            </form>
        </div>
    </div>

    <!-- Success modal (animated) -->
    <div id="successModal" class="modal" style="display: none;">
        <div class="modal-content success-modal-content">
            <div class="modal-body">
                <p class="success-modal-text">Your data has been successfully submitted.<br>We will contact you within 24 hours.</p>
            </div>
        </div>
    </div>

    <script>
        const submitBtn = document.getElementById('submitBtn');
        const submitText = document.getElementById('submitText');
        const submitSpinner = document.getElementById('submitSpinner');
        let isSubmitting = false;
        const maxPriorities = 2;

        // Priority selection (1 to 2)
        document.getElementById('priorityButtons').addEventListener('click', (e) => {
            if (e.target.classList.contains('priority-btn')) {
                const btn = e.target;
                const currentlySelected = document.querySelectorAll('.priority-btn.selected');
                if (btn.classList.contains('selected')) {
                    btn.classList.remove('selected');
                    return;
                }
                if (currentlySelected.length >= maxPriorities) {
                    return;
                }
                btn.classList.add('selected');
            }
        });

        // Handle form submission
        document.getElementById('contactForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            // Prevent multiple submissions
            if (isSubmitting) {
                return;
            }

            document.getElementById('errorMessage').style.display = 'none';

            const priorities = Array.from(document.querySelectorAll('.priority-btn.selected'))
                .map(btn => btn.getAttribute('data-value'));

            const formData = {
                fullName: document.getElementById('fullName').value.trim(),
                doorType: document.getElementById('doorType').value,
                measurements: document.getElementById('measurements').value.trim(),
                phoneNumber: document.getElementById('phoneNumber').value.trim(),
                priorities
            };

            if (!formData.fullName || !formData.doorType || !formData.measurements || !formData.phoneNumber || priorities.length === 0) {
                showError('Please fill in all required fields.');
                return;
            }

            setLoadingState(true);

            try {
                const response = await fetch('/api/leads', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (response.ok) {
                    document.getElementById('contactForm').reset();
                    showSuccessModal();
                } else {
                    showError(data.error || 'An error occurred. Please try again.');
                }
            } catch (error) {
                console.error('Error:', error);
                showError('Network error. Please check your connection and try again.');
            } finally {
                setLoadingState(false);
            }
        });

        // Set loading state on submit button
        function setLoadingState(loading) {
            isSubmitting = loading;
            submitBtn.disabled = loading;
            
            if (loading) {
                submitText.style.display = 'none';
                submitSpinner.style.display = 'inline-block';
                submitBtn.classList.add('loading');
            } else {
                submitText.style.display = 'inline';
                submitSpinner.style.display = 'none';
                submitBtn.classList.remove('loading');
            }
        }

        function showError(message) {
            const errorMsg = document.getElementById('errorMessage');
            document.getElementById('errorText').textContent = message;
            errorMsg.style.display = 'block';
            errorMsg.classList.add('slide-in-top');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function showSuccessModal() {
            const modal = document.getElementById('successModal');
            modal.style.display = 'flex';
            setTimeout(function() {
                modal.classList.add('modal-open');
            }, 10);
        }

        function closeSuccessModal() {
            const modal = document.getElementById('successModal');
            modal.classList.remove('modal-open');
            setTimeout(function() {
                modal.style.display = 'none';
            }, 300);
        }

        document.getElementById('successModal').addEventListener('click', function(e) {
            if (e.target.id === 'successModal') {
                closeSuccessModal();
            }
        });
    </script>
</body>
</html>
