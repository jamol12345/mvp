<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="page-fade-in">
    <div class="container">
        <div class="form-wrapper fade-in-up">
            <h1>Contact Us</h1>
            <p class="subtitle">Fill out the form below and we'll get back to you soon!</p>
            
            <!-- Success Message (hidden by default) -->
            <div id="successMessage" class="message success-message slide-in-top" style="display: none;">
                <p>✅ Thank you! Your information has been submitted successfully.</p>
            </div>

            <!-- Error Message (hidden by default) -->
            <div id="errorMessage" class="message error-message slide-in-top" style="display: none;">
                <p id="errorText"></p>
            </div>

            <!-- Contact Form -->
            <form id="contactForm">
                <div class="form-group">
                    <label for="name">Name <span class="required">*</span></label>
                    <input 
                        type="text" 
                        id="name" 
                        name="name" 
                        required 
                        placeholder="Enter your name"
                    >
                </div>

                <div class="form-group">
                    <label for="surname">Surname <span class="required">*</span></label>
                    <input 
                        type="text" 
                        id="surname" 
                        name="surname" 
                        required 
                        placeholder="Enter your surname"
                    >
                </div>

                <div class="form-group">
                    <label for="phoneNumber">Phone Number <span class="required">*</span></label>
                    <input 
                        type="tel" 
                        id="phoneNumber" 
                        name="phoneNumber" 
                        required 
                        placeholder="Enter your phone number"
                    >
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">
                    <span id="submitText">Submit</span>
                    <span id="submitSpinner" class="spinner" style="display: none;"></span>
                </button>
            </form>
        </div>
    </div>

    <script>
        const submitBtn = document.getElementById('submitBtn');
        const submitText = document.getElementById('submitText');
        const submitSpinner = document.getElementById('submitSpinner');
        let isSubmitting = false;

        // Handle form submission
        document.getElementById('contactForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            // Prevent multiple submissions
            if (isSubmitting) {
                return;
            }

            // Hide previous messages
            document.getElementById('successMessage').style.display = 'none';
            document.getElementById('errorMessage').style.display = 'none';

            // Get form data
            const formData = {
                name: document.getElementById('name').value.trim(),
                surname: document.getElementById('surname').value.trim(),
                phoneNumber: document.getElementById('phoneNumber').value.trim()
            };

            // Validate
            if (!formData.name || !formData.surname || !formData.phoneNumber) {
                showError('Please fill in all required fields.');
                return;
            }

            // Set loading state
            setLoadingState(true);

            try {
                // Submit to backend
                const response = await fetch('/api/leads', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (response.ok) {
                    // Show success message with animation
                    const successMsg = document.getElementById('successMessage');
                    successMsg.style.display = 'block';
                    successMsg.classList.add('slide-in-top');
                    
                    // Reset form
                    document.getElementById('contactForm').reset();
                    
                    // Scroll to top to show success message
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } else {
                    // Show error message
                    showError(data.error || 'An error occurred. Please try again.');
                }
            } catch (error) {
                console.error('Error:', error);
                showError('Network error. Please check your connection and try again.');
            } finally {
                // Remove loading state
                setLoadingState(false);
            }
        });

        // Set loading state on submit button
        function setLoadingState(loading) {
            isSubmitting = loading;
            submitBtn.disabled = loading;
            
            if (loading) {
                submitText.style.display = 'none';
                submitSpinner.style.display = 'inline-block';
                submitBtn.classList.add('loading');
            } else {
                submitText.style.display = 'inline';
                submitSpinner.style.display = 'none';
                submitBtn.classList.remove('loading');
            }
        }

        // Helper function to show error messages
        function showError(message) {
            const errorMsg = document.getElementById('errorMessage');
            document.getElementById('errorText').textContent = message;
            errorMsg.style.display = 'block';
            errorMsg.classList.add('slide-in-top');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
